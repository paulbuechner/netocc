<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · netocc-core/README.md</p>
    <h1>Build pipeline</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="readme-build-pipeline-title readme-build-pipeline-desc">
        <title id="readme-build-pipeline-title">Build pipeline</title>
        <desc id="readme-build-pipeline-desc">netocc-generator writes the committed wrapper interfaces; SWIG turns them and the typemap library into C++ wrappers and C# proxies; CMake builds the wrappers against vcpkg's OCCT into the native runtimes, and the proxies with src/NetOcc become NetOcc.dll.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones, top to bottom: the interface files, SWIG, the compilers. -->
        <g fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8">
          <rect x="40" y="40" width="720" height="200" rx="8"/>
          <rect x="40" y="256" width="720" height="192" rx="8"/>
          <rect x="40" y="464" width="720" height="232" rx="8"/>
        </g>
        <g fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">
          <text x="56" y="57">INTERFACES</text>
          <text x="56" y="273">BUILD.PY GENERATE</text>
          <text x="56" y="481">COMPILE</text>
        </g>

        <!-- Connectors first. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M264,120 V159"/>
          <path d="M340,224 V287"/>
          <path d="M444,224 V287"/>
          <path d="M340,336 V383"/>
          <path d="M444,336 V383"/>
          <path d="M288,432 V495"/>
          <path d="M496,432 V495"/>
          <path d="M184,536 H223"/>
          <path d="M616,536 H577"/>
          <path d="M288,576 V615"/>
        </g>
        <rect x="272" y="134" width="84" height="12" rx="2" fill="#f1f1f1"/>
        <text x="276" y="143" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">WRITES, IN GIT</text>

        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <!-- Interfaces. -->
          <rect x="192" y="72" width="144" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="192" y="72" width="144" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
          <text x="264" y="100" fill="#2d3142" font-size="12" font-weight="600">netocc-generator</text>

          <rect x="152" y="160" width="224" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="152" y="160" width="224" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="264" y="188" fill="#2d3142" font-size="12" font-weight="600">src/SWIG_files/wrapper/*.i</text>
          <text x="264" y="203" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">headers/*_module.hxx, modules.json</text>

          <rect x="408" y="160" width="224" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="408" y="160" width="224" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="520" y="182" fill="#2d3142" font-size="12" font-weight="600">src/SWIG_files/common/*.i</text>
          <text x="520" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">typemap library</text>
          <text x="520" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">extras/*.i companions</text>

          <!-- SWIG, focal: everything after it is its output. -->
          <rect x="304" y="288" width="176" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="304" y="288" width="176" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="392" y="308" fill="#2d3142" font-size="12" font-weight="600">SWIG 4.5.1 -csharp</text>
          <text x="392" y="323" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">build.py generate</text>

          <rect x="204" y="384" width="168" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="204" y="384" width="168" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="288" y="404" fill="#2d3142" font-size="12" font-weight="600">build/generated/cxx</text>
          <text x="288" y="419" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">*_wrap.cxx</text>

          <rect x="412" y="384" width="168" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="412" y="384" width="168" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="496" y="404" fill="#2d3142" font-size="12" font-weight="600">build/generated/cs</text>
          <text x="496" y="419" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">*.cs proxies</text>

          <!-- Compile: native on the left, managed on the right. -->
          <rect x="56" y="496" width="128" height="80" rx="6" fill="#f5f5f5"/>
          <rect x="56" y="496" width="128" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
          <text x="120" y="526" fill="#2d3142" font-size="12" font-weight="600">vcpkg manifest</text>
          <text x="120" y="542" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">OCCT 8.0.1</text>
          <text x="120" y="554" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">per triplet</text>

          <rect x="224" y="496" width="128" height="80" rx="6" fill="#f5f5f5"/>
          <rect x="224" y="496" width="128" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="288" y="520" fill="#2d3142" font-size="12" font-weight="600">CMake</text>
          <text x="288" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">NetOcc&lt;Module&gt;</text>
          <text x="288" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">NetOccRuntime</text>
          <text x="288" y="560" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">build.py native</text>

          <rect x="416" y="496" width="160" height="80" rx="6" fill="#f5f5f5"/>
          <rect x="416" y="496" width="160" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="496" y="520" fill="#2d3142" font-size="12" font-weight="600">NetOcc.dll</text>
          <text x="496" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">net35, net45, net452</text>
          <text x="496" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">net462, net6.0, net8.0</text>
          <text x="496" y="560" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">net10.0 + netstandard2.0</text>

          <rect x="616" y="496" width="128" height="80" rx="6" fill="#f5f5f5"/>
          <rect x="616" y="496" width="128" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="680" y="526" fill="#2d3142" font-size="12" font-weight="600">src/NetOcc</text>
          <text x="680" y="542" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">runtime</text>
          <text x="680" y="554" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">+ gp_* structs</text>

          <rect x="200" y="616" width="176" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="200" y="616" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="288" y="638" fill="#2d3142" font-size="12" font-weight="600">artifacts/runtimes</text>
          <text x="288" y="654" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">{rid}/native</text>
          <text x="288" y="666" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">NetOcc + OCCT TK libraries</text>
        </g>

        <!-- Legend: the two fills that need decoding. -->
        <line x1="40" y1="712" x2="760" y2="712" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.14em">
          <text x="40" y="740">LEGEND</text>
          <rect x="120" y="730" width="20" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="148" y="740">GENERATED</text>
          <rect x="248" y="730" width="20" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
          <text x="276" y="740">OUTSIDE NETOCC-CORE</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
