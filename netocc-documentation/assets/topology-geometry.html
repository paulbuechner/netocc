<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry behind the topology</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · topology.md</p>
    <h1>Geometry behind the topology</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="topology-geometry-title topology-geometry-desc">
        <title id="topology-geometry-title">Geometry behind the topology</title>
        <desc id="topology-geometry-desc">BRep_Tool reads the geometry behind the topology: Pnt gives a vertex's gp_Pnt, Curve and CurveOnSurface an edge's Geom_Curve with its range and its Geom2d_Curve on each face, Surface and Triangulation a face's Geom_Surface and Poly_Triangulation.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Column headings. -->
        <g font-family="'Geist', sans-serif" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">
          <text x="180" y="56">Topology</text>
          <text x="380" y="56">BRep_Tool</text>
          <text x="600" y="56">Geometry</text>
        </g>

        <!-- Connectors first: a BRep_Tool method from each topology type to its geometry. -->
        <line x1="260" y1="100" x2="500" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="366" y="82" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="380" y="91" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Pnt</text>
        <line x1="260" y1="180" x2="500" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="360" y="162" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="380" y="171" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Curve</text>
        <line x1="260" y1="248" x2="500" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="336" y="230" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="380" y="239" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CurveOnSurface</text>
        <line x1="260" y1="328" x2="500" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="354" y="310" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="380" y="319" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Surface</text>
        <line x1="260" y1="396" x2="500" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="338" y="378" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="380" y="387" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Triangulation</text>

        <!-- Topology: one box per type, as tall as the geometry it carries. -->
        <g font-family="'Geist', sans-serif">
          <rect x="100" y="76" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="180" y="104" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">TopoDS_Vertex</text>
          <rect x="100" y="156" width="160" height="116" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="180" y="218" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">TopoDS_Edge</text>
          <rect x="100" y="304" width="160" height="116" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="180" y="366" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">TopoDS_Face</text>
        </g>

        <!-- Geometry: store treatment. -->
        <g font-family="'Geist', sans-serif">
          <rect x="500" y="76" width="200" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="500" y="76" width="200" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="600" y="104" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">gp_Pnt</text>
          <rect x="500" y="156" width="200" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="500" y="156" width="200" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="600" y="178" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Geom_Curve</text>
          <text x="600" y="193" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ range first..last</text>
          <rect x="500" y="224" width="200" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="500" y="224" width="200" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="600" y="246" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Geom2d_Curve</text>
          <text x="600" y="261" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">on each face</text>
          <rect x="500" y="304" width="200" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="500" y="304" width="200" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="600" y="332" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Geom_Surface</text>
          <rect x="500" y="372" width="200" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="500" y="372" width="200" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="600" y="400" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Poly_Triangulation</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
