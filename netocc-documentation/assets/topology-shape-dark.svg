<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="topology-shape-title topology-shape-desc" width="800" height="240">
        <title id="topology-shape-title">What a shape is</title>
        <desc id="topology-shape-desc">A TopoDS_Shape is a light value of three parts, TShape(), Location() and Orientation(); its TShape() refers to the shared TopoDS_TShape, which holds the sub-shapes and the geometry through BRep_TFace, BRep_TEdge and BRep_TVertex.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="240" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Connector first: the shape's TShape() refers to the shared TopoDS_TShape. -->
        <line x1="400" y1="102" x2="500" y2="102" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="420" y="84" width="60" height="12" rx="2" fill="#171717"/>
        <text x="450" y="93" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFERS TO</text>

        <!-- TopoDS_Shape: focal, a light value of three parts. -->
        <rect x="40" y="40" width="360" height="132" rx="6" fill="#171717"/>
        <rect x="40" y="40" width="360" height="132" rx="6" fill="rgba(240,138,89,0.13)" stroke="#f08a59"/>
        <line x1="40" y1="84" x2="400" y2="84" stroke="rgba(240,138,89,0.56)"/>
        <rect x="52" y="56" width="44" height="12" rx="2" fill="none" stroke="rgba(240,138,89,0.80)" stroke-width="0.8"/>
        <text x="74" y="65" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VALUE</text>
        <text x="220" y="66" fill="#e6e6e6" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TopoDS_Shape</text>
        <g font-size="9" font-family="'Geist Mono', monospace">
          <text x="56" y="105" fill="#e6e6e6">TShape()</text>
          <text x="152" y="105" fill="#a6a6a6">the shared topology and geometry</text>
          <text x="56" y="129" fill="#e6e6e6">Location()</text>
          <text x="152" y="129" fill="#a6a6a6">TopLoc_Location, where it's placed</text>
          <text x="56" y="153" fill="#e6e6e6">Orientation()</text>
          <text x="152" y="153" fill="#a6a6a6">TopAbs_Orientation, FORWARD or REVERSED</text>
        </g>

        <!-- TopoDS_TShape: shared between shapes. -->
        <rect x="500" y="80" width="260" height="120" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
        <line x1="500" y1="124" x2="760" y2="124" stroke="rgba(230,230,230,0.12)"/>
        <rect x="512" y="96" width="48" height="12" rx="2" fill="none" stroke="rgba(230,230,230,0.40)" stroke-width="0.8"/>
        <text x="536" y="105" fill="#a6a6a6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHARED</text>
        <text x="630" y="106" fill="#e6e6e6" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TopoDS_TShape</text>
        <g font-size="9" font-family="'Geist Mono', monospace" fill="#a6a6a6">
          <text x="516" y="145">sub-shapes</text>
          <text x="516" y="169">geometry via BRep_TFace,</text>
          <text x="528" y="182">BRep_TEdge, BRep_TVertex</text>
        </g>
      </g></svg>
