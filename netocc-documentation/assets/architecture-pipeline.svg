<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 816" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-pipeline-title architecture-pipeline-desc" width="800" height="816">
        <title id="architecture-pipeline-title">From headers to packages</title>
        <desc id="architecture-pipeline-desc">netocc-gen reads OCCT's headers and writes interface files and value-type structs; SWIG turns the interface files and the typemap library into C++ wrappers and C# proxies; CMake and dotnet build them into the native libraries and NetOcc.dll, which go into the NuGet packages with NetOcc.xml, made from the headers' doc comments.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="816" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones: the three stages. -->
        <rect x="40" y="40" width="720" height="240" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="40" y="296" width="720" height="200" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="40" y="512" width="720" height="240" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.14em">
          <text x="56" y="56">GENERATE</text>
          <text x="56" y="312">WRAP</text>
          <text x="56" y="528">BUILD AND PACK</text>
        </g>

        <!-- Connectors, before the boxes. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2">
          <path d="M376,120 V142" marker-end="url(#arrow)"/>
          <path d="M376,192 V214" marker-end="url(#arrow)"/>
          <path d="M472,168 H592 Q600,168 600,176 V214" marker-end="url(#arrow)"/>
          <path d="M472,96 H720 Q728,96 728,104 V632 Q728,640 720,640 H698" marker-end="url(#arrow)"/>
          <path d="M248,360 H278" marker-end="url(#arrow)"/>
          <path d="M376,264 V334" marker-end="url(#arrow)"/>
          <path d="M376,384 V430" marker-end="url(#arrow)"/>
          <path d="M320,384 V404 Q320,412 312,412 H160 Q152,412 152,420 V430" marker-end="url(#arrow)"/>
          <path d="M152,480 V542" marker-end="url(#arrow)"/>
          <path d="M376,480 V542" marker-end="url(#arrow)"/>
          <path d="M600,264 V560 Q600,568 592,568 H474" marker-end="url(#arrow)"/>
          <path d="M152,592 V614" marker-end="url(#arrow)"/>
          <path d="M376,592 V614" marker-end="url(#arrow)"/>
          <path d="M152,664 V686" marker-end="url(#arrow)"/>
          <path d="M376,664 V686" marker-end="url(#arrow)"/>
          <path d="M600,664 V686" marker-end="url(#arrow)"/>
        </g>

        <!-- Arrow label: the headers' doc comments become NetOcc.xml. -->
        <rect x="558" y="76" width="76" height="12" rx="2" fill="#f1f1f2"/>
        <text x="596" y="85" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DOC COMMENTS</text>

        <!-- Nodes: tools white, files tinted, the two generators focal. -->
        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">
          <rect x="280" y="72" width="192" height="48" rx="6" fill="#ebebec" stroke="#4f5d75"/>
          <text x="376" y="100">OCCT 8.0.1 headers</text>

          <rect x="280" y="144" width="192" height="48" rx="6" fill="#f1e7e4" stroke="#bf4520"/>
          <text x="376" y="165">netocc-gen</text>

          <rect x="280" y="216" width="192" height="48" rx="6" fill="#ebebec" stroke="#4f5d75"/>
          <text x="376" y="237">Interface files (.i)</text>

          <rect x="504" y="216" width="192" height="48" rx="6" fill="#ebebec" stroke="#4f5d75"/>
          <text x="600" y="237">Value-type structs</text>

          <rect x="56" y="328" width="192" height="64" rx="6" fill="#ebebec" stroke="#4f5d75"/>
          <text x="152" y="350">Typemap library</text>

          <rect x="280" y="336" width="192" height="48" rx="6" fill="#f1e7e4" stroke="#bf4520"/>
          <text x="376" y="364">SWIG</text>

          <rect x="56" y="432" width="192" height="48" rx="6" fill="#ebebec" stroke="#4f5d75"/>
          <text x="152" y="460">C++ wrappers</text>

          <rect x="280" y="432" width="192" height="48" rx="6" fill="#ebebec" stroke="#4f5d75"/>
          <text x="376" y="460">C# proxies</text>

          <rect x="56" y="544" width="192" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="152" y="572">CMake + Ninja</text>

          <rect x="280" y="544" width="192" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="376" y="572">dotnet build</text>

          <rect x="56" y="616" width="192" height="48" rx="6" fill="#ebebec" stroke="#4f5d75"/>
          <text x="152" y="637">NetOcc&lt;Module&gt;</text>

          <rect x="280" y="616" width="192" height="48" rx="6" fill="#ebebec" stroke="#4f5d75"/>
          <text x="376" y="637">NetOcc.dll</text>

          <rect x="504" y="616" width="192" height="48" rx="6" fill="#ebebec" stroke="#4f5d75"/>
          <text x="600" y="637">NetOcc.xml</text>

          <rect x="56" y="688" width="640" height="48" rx="6" fill="#ebebec" stroke="#4f5d75"/>
          <text x="376" y="716">NuGet packages</text>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">
          <text x="376" y="180">libclang</text>
          <text x="376" y="252">one per OCCT package</text>
          <text x="600" y="252">.g.cs</text>
          <text x="152" y="366">handles, strings, streams,</text>
          <text x="152" y="379">collections, keep-alive</text>
          <text x="152" y="652">libraries, per platform</text>
          <text x="376" y="652">8 target frameworks</text>
          <text x="600" y="652">IntelliSense</text>
        </g>

        <!-- Legend: what the two box treatments mean. -->
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.14em">
          <rect x="40" y="770" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="62" y="778">TOOL</text>
          <rect x="120" y="770" width="14" height="10" rx="2" fill="#ebebec" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="142" y="778">FILE</text>
        </g>
      </g></svg>
