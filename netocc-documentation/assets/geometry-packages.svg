<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="geometry-packages-title geometry-packages-desc" width="800" height="256">
        <title id="geometry-packages-title">Geometry packages</title>
        <desc id="geometry-packages-desc">gp values define the Geom and Geom2d curves and surfaces, which algorithms in GeomAPI, GCPnts and Extrema take directly or wrapped by adaptors such as GeomAdaptor_Curve.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="256" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors first. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M208,74 H272"/>
          <path d="M472,74 H576"/>
          <path d="M372,108 V174 Q372,182 380,182 H452"/>
          <path d="M596,182 H656 Q664,182 664,174 V108"/>
        </g>

        <!-- Arrow labels, masked, 8px off their strokes. -->
        <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#5a6580">
          <rect x="218" y="54" width="44" height="12" rx="2" fill="#f5f5f5"/>
          <text x="240" y="63" text-anchor="middle">DEFINE</text>
          <rect x="380" y="128" width="64" height="12" rx="2" fill="#f5f5f5"/>
          <text x="384" y="137">WRAPPED BY</text>
          <rect x="672" y="128" width="76" height="12" rx="2" fill="#f5f5f5"/>
          <text x="676" y="137">EVALUATED BY</text>
        </g>

        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="48" y="40" width="160" height="68" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="128" y="64" fill="#2d3142" font-size="12" font-weight="600">gp: values</text>
          <text x="128" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">gp_Pnt · gp_Vec · gp_Dir</text>
          <text x="128" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">gp_Ax2 · gp_Trsf</text>

          <!-- Focal: the curves and surfaces the page is about. -->
          <rect x="272" y="40" width="200" height="68" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="372" y="64" fill="#2d3142" font-size="12" font-weight="600">Geom / Geom2d: handles</text>
          <text x="372" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Geom_Circle · Geom_BSplineCurve</text>
          <text x="372" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Geom_Plane</text>

          <rect x="576" y="40" width="176" height="68" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="664" y="70" fill="#2d3142" font-size="12" font-weight="600">Algorithms</text>
          <text x="664" y="86" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">GeomAPI · GCPnts · Extrema</text>

          <rect x="452" y="148" width="144" height="68" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="524" y="172" fill="#2d3142" font-size="12" font-weight="600">Adaptors</text>
          <text x="524" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">GeomAdaptor_Curve</text>
          <text x="524" y="201" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">BRepAdaptor_Surface</text>
        </g>
      </g></svg>
