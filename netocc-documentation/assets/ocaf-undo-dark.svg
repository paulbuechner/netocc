<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ocaf-undo-title ocaf-undo-desc" width="800" height="412">
        <title id="ocaf-undo-title">Undo and redo</title>
        <desc id="ocaf-undo-desc">Your code sets an undo limit on a TDocStd_Document, changes an attribute between OpenCommand and CommitCommand as one undoable step, then Undo restores the old value and Redo applies the change again.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Instrument Serif';font-weight:400;font-style:italic;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="412" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Lifelines. -->
        <line x1="240" y1="84" x2="240" y2="372" stroke="rgba(230,230,230,0.28)" stroke-dasharray="3,3"/>
        <line x1="560" y1="84" x2="560" y2="372" stroke="rgba(230,230,230,0.28)" stroke-dasharray="3,3"/>

        <!-- One undoable step: OpenCommand to CommitCommand (focal). -->
        <path d="M228,168 H220 V264 H228" fill="none" stroke="#f08a59" stroke-width="1.2"/>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#f08a59" letter-spacing="0.14em" text-anchor="end">
          <text x="208" y="213">ONE UNDOABLE</text>
          <text x="208" y="225">STEP</text>
        </g>

        <!-- Messages, time flowing down. -->
        <g fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)">
          <line x1="240" y1="128" x2="560" y2="128"/>
          <line x1="240" y1="172" x2="560" y2="172"/>
          <line x1="240" y1="216" x2="560" y2="216"/>
          <line x1="240" y1="260" x2="560" y2="260"/>
          <line x1="240" y1="304" x2="560" y2="304"/>
          <line x1="240" y1="348" x2="560" y2="348"/>
        </g>
        <g fill="#171717">
          <rect x="352" y="106" width="96" height="14" rx="2"/>
          <rect x="360" y="150" width="80" height="14" rx="2"/>
          <rect x="316" y="194" width="168" height="14" rx="2"/>
          <rect x="356" y="238" width="88" height="14" rx="2"/>
          <rect x="376" y="282" width="48" height="14" rx="2"/>
          <rect x="376" y="326" width="48" height="14" rx="2"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#e6e6e6" text-anchor="middle">
          <text x="400" y="117">SetUndoLimit(10)</text>
          <text x="400" y="161">OpenCommand()</text>
          <text x="400" y="205">TDataStd_Real.Set(width, 55)</text>
          <text x="400" y="249">CommitCommand()</text>
          <text x="400" y="293">Undo()</text>
          <text x="400" y="337">Redo()</text>
        </g>

        <!-- Notes on the document, as callouts in the right margin. -->
        <g fill="none" stroke="rgba(230,230,230,0.48)" stroke-dasharray="4,3">
          <path d="M596,238 H564"/>
          <path d="M596,326 H564"/>
        </g>
        <circle cx="562" cy="238" r="2" fill="#e6e6e6"/>
        <circle cx="562" cy="326" r="2" fill="#e6e6e6"/>
        <g font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="#e6e6e6">
          <text x="604" y="236">attributes back up</text>
          <text x="604" y="252">their old values</text>
          <text x="604" y="331">width is 40 again</text>
        </g>

        <!-- Actors. -->
        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#e6e6e6" text-anchor="middle">
          <rect x="160" y="40" width="160" height="44" rx="6" fill="#171717"/>
          <rect x="160" y="40" width="160" height="44" rx="6" fill="rgba(166,166,166,0.18)" stroke="#8c8c8c"/>
          <text x="240" y="66">your code</text>
          <rect x="472" y="40" width="176" height="44" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="560" y="66">TDocStd_Document</text>
        </g>
      </g></svg>
