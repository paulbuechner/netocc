<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 348" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifetimes-heaps-title lifetimes-heaps-desc" width="800" height="348">
        <title id="lifetimes-heaps-title">Proxies and their native objects</title>
        <desc id="lifetimes-heaps-desc">Two Geom_Circle proxies on the .NET heap each hold one reference on the same native Geom_Circle, whose reference count is 2; a BRepMesh_IncrementalMesh proxy owns its native mesher.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="348" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Zones: the two heaps. -->
        <rect x="40" y="40" width="288" height="240" rx="8" fill="rgba(230,230,230,0.04)" stroke="rgba(230,230,230,0.18)" stroke-width="0.8"/>
        <text x="56" y="53" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">.NET HEAP</text>
        <rect x="472" y="40" width="288" height="240" rx="8" fill="rgba(230,230,230,0.04)" stroke="rgba(230,230,230,0.18)" stroke-width="0.8"/>
        <text x="488" y="53" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NATIVE HEAP</text>

        <!-- Connectors, before the boxes. -->
        <path d="M304,96 H496" fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M304,168 H496" fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M304,240 H496" fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="#8c8c8c">
          <rect x="356" y="76" width="88" height="12" rx="2" fill="#171717"/>
          <text x="400" y="85">ONE REFERENCE</text>
          <rect x="356" y="148" width="88" height="12" rx="2" fill="#171717"/>
          <text x="400" y="157">ONE REFERENCE</text>
          <rect x="380" y="220" width="40" height="12" rx="2" fill="#171717"/>
          <text x="400" y="229">OWNS</text>
        </g>

        <!-- Proxies. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="64" y="72" width="240" height="48" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="184" y="100" fill="#e6e6e6" font-size="12" font-weight="600">Geom_Circle proxy</text>

          <rect x="64" y="144" width="240" height="48" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="184" y="165" fill="#e6e6e6" font-size="12" font-weight="600">another proxy</text>
          <text x="184" y="180" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">of the same circle</text>

          <rect x="64" y="216" width="240" height="48" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="184" y="244" fill="#e6e6e6" font-size="12" font-weight="600">BRepMesh_IncrementalMesh proxy</text>
        </g>

        <!-- Native objects; the shared, reference-counted circle is focal. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="496" y="72" width="240" height="120" rx="6" fill="#171717"/>
          <rect x="496" y="72" width="240" height="120" rx="6" fill="rgba(240,138,89,0.13)" stroke="#f08a59"/>
          <text x="616" y="129" fill="#e6e6e6" font-size="12" font-weight="600">Geom_Circle</text>
          <text x="616" y="145" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">reference count 2</text>

          <rect x="496" y="216" width="240" height="48" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="616" y="244" fill="#e6e6e6" font-size="12" font-weight="600">BRepMesh_IncrementalMesh</text>
        </g>

        <text x="40" y="308" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">THE GARBAGE COLLECTOR SEES ONLY THE PROXIES</text>
      </g></svg>
