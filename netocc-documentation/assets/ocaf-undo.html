<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undo and redo</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · ocaf.md</p>
    <h1>Undo and redo</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ocaf-undo-title ocaf-undo-desc">
        <title id="ocaf-undo-title">Undo and redo</title>
        <desc id="ocaf-undo-desc">Your code sets an undo limit on a TDocStd_Document, changes an attribute between OpenCommand and CommitCommand as one undoable step, then Undo restores the old value and Redo applies the change again.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines. -->
        <line x1="240" y1="84" x2="240" y2="372" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/>
        <line x1="560" y1="84" x2="560" y2="372" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/>

        <!-- One undoable step: OpenCommand to CommitCommand (focal). -->
        <path d="M228,168 H220 V264 H228" fill="none" stroke="#bf4520" stroke-width="1.2"/>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#bf4520" letter-spacing="0.14em" text-anchor="end">
          <text x="208" y="213">ONE UNDOABLE</text>
          <text x="208" y="225">STEP</text>
        </g>

        <!-- Messages, time flowing down. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <line x1="240" y1="128" x2="560" y2="128"/>
          <line x1="240" y1="172" x2="560" y2="172"/>
          <line x1="240" y1="216" x2="560" y2="216"/>
          <line x1="240" y1="260" x2="560" y2="260"/>
          <line x1="240" y1="304" x2="560" y2="304"/>
          <line x1="240" y1="348" x2="560" y2="348"/>
        </g>
        <g fill="#f5f5f5">
          <rect x="352" y="106" width="96" height="14" rx="2"/>
          <rect x="360" y="150" width="80" height="14" rx="2"/>
          <rect x="316" y="194" width="168" height="14" rx="2"/>
          <rect x="356" y="238" width="88" height="14" rx="2"/>
          <rect x="376" y="282" width="48" height="14" rx="2"/>
          <rect x="376" y="326" width="48" height="14" rx="2"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#2d3142" text-anchor="middle">
          <text x="400" y="117">SetUndoLimit(10)</text>
          <text x="400" y="161">OpenCommand()</text>
          <text x="400" y="205">TDataStd_Real.Set(width, 55)</text>
          <text x="400" y="249">CommitCommand()</text>
          <text x="400" y="293">Undo()</text>
          <text x="400" y="337">Redo()</text>
        </g>

        <!-- Notes on the document, as callouts in the right margin. -->
        <g fill="none" stroke="rgba(45,49,66,0.40)" stroke-dasharray="4,3">
          <path d="M596,238 H564"/>
          <path d="M596,326 H564"/>
        </g>
        <circle cx="562" cy="238" r="2" fill="#2d3142"/>
        <circle cx="562" cy="326" r="2" fill="#2d3142"/>
        <g font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="#2d3142">
          <text x="604" y="236">attributes back up</text>
          <text x="604" y="252">their old values</text>
          <text x="604" y="331">width is 40 again</text>
        </g>

        <!-- Actors. -->
        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">
          <rect x="160" y="40" width="160" height="44" rx="6" fill="#f5f5f5"/>
          <rect x="160" y="40" width="160" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
          <text x="240" y="66">your code</text>
          <rect x="472" y="40" width="176" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="560" y="66">TDocStd_Document</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
