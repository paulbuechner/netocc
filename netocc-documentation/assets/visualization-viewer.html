<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The objects behind a 3D view</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · visualization.md</p>
    <h1>The objects behind a 3D view</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 348" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="visualization-viewer-title visualization-viewer-desc">
        <title id="visualization-viewer-title">The objects behind a 3D view</title>
        <desc id="visualization-viewer-desc">A display connection feeds an OpenGl_GraphicDriver and its V3d_Viewer; the viewer has an AIS_InteractiveContext, which displays AIS_Shape and XCAFPrs_AISObject presentations, and a V3d_View, which draws into a native window wrapped by Aspect_Window.FromNativeHandle and is driven by AIS_ViewController.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors first. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M240,66 H300"/>
          <path d="M400,92 V148"/>
          <path d="M300,174 H240"/>
          <path d="M500,174 H560"/>
          <path d="M660,92 V148"/>
          <path d="M96,200 V256"/>
          <path d="M184,200 V220 A8,8 0 0 0 192,228 H248 A8,8 0 0 1 256,236 V256"/>
          <path d="M660,256 V200" stroke-dasharray="5,4"/>
        </g>

        <!-- Edge labels beside their vertical segments. -->
        <g fill="#f5f5f5">
          <rect x="556" y="106" width="96" height="28" rx="2"/>
          <rect x="560" y="214" width="92" height="28" rx="2"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#2d3142" text-anchor="end">
          <text x="648" y="117">Aspect_Window.</text>
          <text x="648" y="129">FromNativeHandle</text>
          <text x="648" y="225">FlushViewEvents</text>
          <text x="648" y="237">(context, view)</text>
        </g>

        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <!-- Row 1: display connection, driver, native window (external). -->
          <rect x="40" y="40" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="140" y="70" fill="#2d3142" font-size="12" font-weight="600">Aspect_DisplayConnection</text>

          <rect x="300" y="40" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="400" y="62" fill="#2d3142" font-size="12" font-weight="600">OpenGl_GraphicDriver</text>
          <text x="400" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">one per display</text>

          <rect x="560" y="40" width="200" height="52" rx="6" fill="#f5f5f5"/>
          <rect x="560" y="40" width="200" height="52" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
          <text x="660" y="62" fill="#2d3142" font-size="12" font-weight="600">native window</text>
          <text x="660" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">HWND, X11 Window, NSView</text>

          <!-- Row 2: context, viewer, view (focal). -->
          <rect x="40" y="148" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="140" y="170" fill="#2d3142" font-size="12" font-weight="600">AIS_InteractiveContext</text>
          <text x="140" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">display, highlight, select</text>

          <rect x="300" y="148" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="400" y="170" fill="#2d3142" font-size="12" font-weight="600">V3d_Viewer</text>
          <text x="400" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">lights, the shared scene</text>

          <rect x="560" y="148" width="200" height="52" rx="6" fill="#f5f5f5"/>
          <rect x="560" y="148" width="200" height="52" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="660" y="170" fill="#2d3142" font-size="12" font-weight="600">V3d_View</text>
          <text x="660" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">camera, one per window</text>

          <!-- Row 3: presentations, controller. -->
          <rect x="40" y="256" width="112" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="96" y="286" fill="#2d3142" font-size="12" font-weight="600">AIS_Shape</text>

          <rect x="176" y="256" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="256" y="286" fill="#2d3142" font-size="12" font-weight="600">XCAFPrs_AISObject</text>

          <rect x="560" y="256" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="660" y="278" fill="#2d3142" font-size="12" font-weight="600">AIS_ViewController</text>
          <text x="660" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">mouse to camera and selection</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
