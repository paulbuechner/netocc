<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 364" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="visualization-input-title visualization-input-desc" width="800" height="364">
        <title id="visualization-input-title">Mouse input</title>
        <desc id="visualization-input-desc">The window procedure passes mouse positions to AIS_ViewController, which returns true when something changed; FlushViewEvents then has the controller rotate, pan or zoom the V3d_View's camera and redraw it.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="364" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Lifelines. -->
        <line x1="140" y1="84" x2="140" y2="324" stroke="rgba(230,230,230,0.20)" stroke-dasharray="3,3"/>
        <line x1="420" y1="84" x2="420" y2="324" stroke="rgba(230,230,230,0.20)" stroke-dasharray="3,3"/>
        <line x1="660" y1="84" x2="660" y2="324" stroke="rgba(230,230,230,0.20)" stroke-dasharray="3,3"/>

        <!-- Activation bars: the controller holds control for each call. -->
        <g fill="#212121" stroke="#a6a6a6" stroke-width="0.8">
          <rect x="416" y="124" width="8" height="40"/>
          <rect x="416" y="212" width="8" height="88"/>
        </g>

        <!-- Calls: solid. Return: dashed. -->
        <g fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)">
          <line x1="140" y1="124" x2="416" y2="124"/>
          <line x1="416" y1="164" x2="140" y2="164" stroke-dasharray="5,4"/>
          <line x1="140" y1="212" x2="416" y2="212"/>
          <line x1="424" y1="256" x2="660" y2="256"/>
          <line x1="424" y1="300" x2="660" y2="300"/>
        </g>

        <!-- Message labels on paper masks. -->
        <g fill="#171717">
          <rect x="156" y="102" width="244" height="14" rx="2"/>
          <rect x="232" y="142" width="92" height="14" rx="2"/>
          <rect x="190" y="190" width="176" height="14" rx="2"/>
          <rect x="504" y="224" width="76" height="24" rx="2"/>
          <rect x="520" y="280" width="44" height="12" rx="2"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#e6e6e6" text-anchor="middle">
          <text x="278" y="113">UpdateMousePosition(point, buttons, keys)</text>
          <text x="278" y="201">FlushViewEvents(context, view)</text>
        </g>
        <text x="278" y="153" font-family="'Geist Mono', monospace" font-size="9" fill="#e6e6e6" text-anchor="middle">true<tspan font-size="8" fill="#a6a6a6" letter-spacing="0.08em"> IF CHANGED</tspan></text>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#a6a6a6" text-anchor="middle" letter-spacing="0.08em">
          <text x="542" y="233">ROTATE, PAN,</text>
          <text x="542" y="244">ZOOM CAMERA</text>
          <text x="542" y="289">REDRAW</text>
        </g>

        <!-- Actors: the window procedure (your code), the controller (focal), the view. -->
        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#e6e6e6" text-anchor="middle">
          <rect x="60" y="40" width="160" height="44" rx="6" fill="#171717"/>
          <rect x="60" y="40" width="160" height="44" rx="6" fill="rgba(166,166,166,0.10)" stroke="#8c8c8c"/>
          <text x="140" y="66">window procedure</text>
          <rect x="340" y="40" width="160" height="44" rx="6" fill="#171717"/>
          <rect x="340" y="40" width="160" height="44" rx="6" fill="rgba(240,138,89,0.13)" stroke="#f08a59"/>
          <text x="420" y="66">AIS_ViewController</text>
          <rect x="580" y="40" width="160" height="44" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="660" y="66">V3d_View</text>
        </g>
      </g></svg>
