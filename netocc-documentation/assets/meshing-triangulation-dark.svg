<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="meshing-triangulation-title meshing-triangulation-desc" width="800" height="440">
        <title id="meshing-triangulation-title">Triangulating a shape</title>
        <desc id="meshing-triangulation-desc">BRepMesh_IncrementalMesh stores a Poly_Triangulation on each face of a TopoDS_Shape; BRep_Tool.Triangulation reads its nodes and triangles in the face's coordinates, which the location and orientation turn into vertex and index buffers, while StlAPI_Writer, RWGltf_CafWriter and AIS_Shape use the stored triangulation directly.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="440" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Connectors first. The main chain runs down; the stored triangulation fans out to its users. -->
        <g fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M160,88 V143"/>
          <path d="M160,192 V247"/>
          <path d="M160,296 V351"/>
          <path d="M260,152 H563"/>
          <path d="M260,168 H448 Q456,168 456,176 V212 Q456,220 464,220 H563"/>
          <path d="M260,184 H432 Q440,184 440,192 V280 Q440,288 448,288 H563"/>
        </g>

        <!-- Labels beside the vertical segments: the calls keep their case, they are identifiers. -->
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#8c8c8c" letter-spacing="0.06em">
          <rect x="168" y="110" width="140" height="12" rx="2" fill="#171717"/>
          <text x="172" y="119">BRepMesh_IncrementalMesh</text>
          <rect x="168" y="208" width="136" height="24" rx="2" fill="#171717"/>
          <text x="172" y="217">BRep_Tool.Triangulation</text>
          <text x="172" y="228">(face, location)</text>
          <rect x="168" y="312" width="72" height="24" rx="2" fill="#171717"/>
          <text x="172" y="321">LOCATION,</text>
          <text x="172" y="332">ORIENTATION</text>
        </g>

        <!-- Main chain. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="60" y="40" width="200" height="48" rx="6" fill="#171717"/>
          <rect x="60" y="40" width="200" height="48" rx="6" fill="rgba(166,166,166,0.10)" stroke="#8c8c8c"/>
          <text x="160" y="68" fill="#e6e6e6" font-size="12" font-weight="600">TopoDS_Shape</text>

          <rect x="60" y="144" width="200" height="48" rx="6" fill="#171717"/>
          <rect x="60" y="144" width="200" height="48" rx="6" fill="rgba(240,138,89,0.13)" stroke="#f08a59"/>
          <text x="160" y="164" fill="#e6e6e6" font-size="12" font-weight="600">Poly_Triangulation</text>
          <text x="160" y="179" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">on each face</text>

          <rect x="60" y="248" width="200" height="48" rx="6" fill="#171717"/>
          <rect x="60" y="248" width="200" height="48" rx="6" fill="rgba(230,230,230,0.05)" stroke="#a6a6a6"/>
          <text x="160" y="268" fill="#e6e6e6" font-size="12" font-weight="600">nodes + triangles</text>
          <text x="160" y="283" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">in the face's coordinates</text>

          <rect x="60" y="352" width="200" height="48" rx="6" fill="#171717"/>
          <rect x="60" y="352" width="200" height="48" rx="6" fill="rgba(230,230,230,0.05)" stroke="#a6a6a6"/>
          <text x="160" y="380" fill="#e6e6e6" font-size="12" font-weight="600">vertex and index buffers</text>
        </g>

        <!-- Users of the stored triangulation. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="564" y="128" width="176" height="48" rx="6" fill="#171717"/>
          <rect x="564" y="128" width="176" height="48" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="652" y="156" fill="#e6e6e6" font-size="12" font-weight="600">StlAPI_Writer</text>

          <rect x="564" y="196" width="176" height="48" rx="6" fill="#171717"/>
          <rect x="564" y="196" width="176" height="48" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="652" y="224" fill="#e6e6e6" font-size="12" font-weight="600">RWGltf_CafWriter</text>

          <rect x="564" y="264" width="176" height="48" rx="6" fill="#171717"/>
          <rect x="564" y="264" width="176" height="48" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="652" y="284" fill="#e6e6e6" font-size="12" font-weight="600">AIS_Shape</text>
          <text x="652" y="299" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">shows it, meshes if missing</text>
        </g>
      </g></svg>
