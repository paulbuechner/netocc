<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What a shape is</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">UML class · topology.md</p>
    <h1>What a shape is</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="topology-shape-title topology-shape-desc">
        <title id="topology-shape-title">What a shape is</title>
        <desc id="topology-shape-desc">A TopoDS_Shape is a light value of three parts, TShape(), Location() and Orientation(); its TShape() refers to the shared TopoDS_TShape, which holds the sub-shapes and the geometry through BRep_TFace, BRep_TEdge and BRep_TVertex.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connector first: the shape's TShape() refers to the shared TopoDS_TShape. -->
        <line x1="400" y1="102" x2="500" y2="102" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="420" y="84" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="450" y="93" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFERS TO</text>

        <!-- TopoDS_Shape: focal, a light value of three parts. -->
        <rect x="40" y="40" width="360" height="132" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="40" width="360" height="132" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
        <line x1="40" y1="84" x2="400" y2="84" stroke="rgba(191,69,32,0.35)"/>
        <rect x="52" y="56" width="44" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="74" y="65" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VALUE</text>
        <text x="220" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TopoDS_Shape</text>
        <g font-size="9" font-family="'Geist Mono', monospace">
          <text x="56" y="105" fill="#2d3142">TShape()</text>
          <text x="152" y="105" fill="#4f5d75">the shared topology and geometry</text>
          <text x="56" y="129" fill="#2d3142">Location()</text>
          <text x="152" y="129" fill="#4f5d75">TopLoc_Location, where it's placed</text>
          <text x="56" y="153" fill="#2d3142">Orientation()</text>
          <text x="152" y="153" fill="#4f5d75">TopAbs_Orientation, FORWARD or REVERSED</text>
        </g>

        <!-- TopoDS_TShape: shared between shapes. -->
        <rect x="500" y="80" width="260" height="120" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <line x1="500" y1="124" x2="760" y2="124" stroke="rgba(45,49,66,0.12)"/>
        <rect x="512" y="96" width="48" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="536" y="105" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHARED</text>
        <text x="630" y="106" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TopoDS_TShape</text>
        <g font-size="9" font-family="'Geist Mono', monospace" fill="#4f5d75">
          <text x="516" y="145">sub-shapes</text>
          <text x="516" y="169">geometry via BRep_TFace,</text>
          <text x="528" y="182">BRep_TEdge, BRep_TVertex</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
