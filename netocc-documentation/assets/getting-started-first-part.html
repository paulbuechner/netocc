<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A first part</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · getting-started.md</p>
    <h1>A first part</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="getting-started-first-part-title getting-started-first-part-desc">
        <title id="getting-started-first-part-title">A first part</title>
        <desc id="getting-started-first-part-desc">A box and a cylinder are cut into a block with a hole, which MakeFillet rounds; the rounded part is measured with VolumeProperties, written as a STEP file, and meshed with IncrementalMesh for an STL file.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors first. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M156,108 H168 Q176,108 176,116 V132 Q176,140 184,140 H196"/>
          <path d="M156,188 H168 Q176,188 176,180 V164 Q176,156 184,156 H196"/>
          <path d="M284,148 H324"/>
          <path d="M428,134 H440 Q448,134 448,126 V76 Q448,68 456,68 H468"/>
          <path d="M428,148 H468"/>
          <path d="M428,162 H440 Q448,162 448,170 V220 Q448,228 456,228 H468"/>
          <path d="M612,228 H652"/>
        </g>

        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <!-- The two primitives. -->
          <rect x="44" y="80" width="112" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="100" y="104" fill="#2d3142" font-size="12" font-weight="600">MakeBox</text>
          <text x="100" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">BRepPrimAPI</text>

          <rect x="44" y="160" width="112" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="100" y="184" fill="#2d3142" font-size="12" font-weight="600">MakeCylinder</text>
          <text x="100" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">BRepPrimAPI</text>

          <rect x="196" y="120" width="88" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="240" y="144" fill="#2d3142" font-size="12" font-weight="600">Cut</text>
          <text x="240" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">BRepAlgoAPI</text>

          <!-- Focal: the finished part every output reads. -->
          <rect x="324" y="120" width="104" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="376" y="144" fill="#2d3142" font-size="12" font-weight="600">MakeFillet</text>
          <text x="376" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">BRepFilletAPI</text>

          <!-- Outputs; files in the store treatment. -->
          <rect x="468" y="40" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="540" y="64" fill="#2d3142" font-size="12" font-weight="600">VolumeProperties</text>
          <text x="540" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">BRepGProp</text>

          <rect x="468" y="120" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="540" y="144" fill="#2d3142" font-size="12" font-weight="600">STEP file</text>
          <text x="540" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">STEPControl_Writer</text>

          <rect x="468" y="200" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="540" y="224" fill="#2d3142" font-size="12" font-weight="600">IncrementalMesh</text>
          <text x="540" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">BRepMesh</text>

          <rect x="652" y="200" width="104" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="704" y="224" fill="#2d3142" font-size="12" font-weight="600">STL file</text>
          <text x="704" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">StlAPI_Writer</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
