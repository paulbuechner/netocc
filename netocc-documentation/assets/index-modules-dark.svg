<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="index-modules-title index-modules-desc" width="800" height="560">
        <title id="index-modules-title">NetOcc at a glance</title>
        <desc id="index-modules-desc">An app calls one assembly, NetOcc.dll, with a namespace per OCCT package; it calls one native library per OCCT module (FoundationClasses, ModelingData, ModelingAlgorithms, Visualization, ApplicationFramework, DataExchange), which call OCCT 8.0.1's TK libraries.</desc>
