<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Builder states</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · modeling.md</p>
    <h1>Builder states</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 324" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="modeling-builder-title modeling-builder-desc">
        <title id="modeling-builder-title">Builder states</title>
        <desc id="modeling-builder-desc">A modeling builder is configured by its constructor and by Add and Set calls; Build() either succeeds, after which Shape(), Modified() and Generated() give the results, or fails, after which IsDone() is false and Error() says why.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Transitions first. -->
        <line x1="54" y1="180" x2="168" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="77" y="162" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="111" y="171" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">new(input)</text>
        <path d="M208,156 V136 Q208,128 216,128 H272 Q280,128 280,136 V156" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="208" y="110" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="244" y="119" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Add, Set...</text>
        <path d="M320,172 H352 Q360,172 360,164 V108 Q360,100 368,100 H500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="396" y="82" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="430" y="91" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Build() ok</text>
        <path d="M320,188 H352 Q360,188 360,196 V252 Q360,260 368,260 H500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="388" y="242" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="430" y="251" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Build() fails</text>
        <line x1="628" y1="100" x2="736" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="646" y="58" width="72" height="36" rx="2" fill="#f5f5f5"/>
        <text x="682" y="68" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Shape()</text>
        <text x="682" y="79" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Modified()</text>
        <text x="682" y="90" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Generated()</text>
        <line x1="628" y1="260" x2="736" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="638" y="230" width="88" height="24" rx="2" fill="#f5f5f5"/>
        <text x="682" y="239" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IsDone() false</text>
        <text x="682" y="250" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Error(): why</text>

        <!-- Start and end dots. -->
        <circle cx="48" cy="180" r="6" fill="#2d3142"/>
        <circle cx="744" cy="100" r="8" fill="#f5f5f5" stroke="#2d3142"/>
        <circle cx="744" cy="100" r="5" fill="#2d3142"/>
        <circle cx="744" cy="260" r="8" fill="#f5f5f5" stroke="#2d3142"/>
        <circle cx="744" cy="260" r="5" fill="#2d3142"/>

        <!-- States; Failed is focal. -->
        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">
          <rect x="168" y="156" width="152" height="48" rx="8" fill="#ffffff" stroke="#2d3142"/>
          <text x="244" y="184">Configured</text>
          <rect x="500" y="76" width="128" height="48" rx="8" fill="#ffffff" stroke="#2d3142"/>
          <text x="564" y="104">Done</text>
          <rect x="500" y="236" width="128" height="48" rx="8" fill="#f5f5f5"/>
          <rect x="500" y="236" width="128" height="48" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="564" y="264">Failed</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
