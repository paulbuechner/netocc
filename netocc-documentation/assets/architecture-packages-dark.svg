<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-packages-title architecture-packages-desc" width="800" height="416">
        <title id="architecture-packages-title">Packages</title>
        <desc id="architecture-packages-desc">Your app references NetOcc, which holds NetOcc.dll for net35 to net10.0 and NetOcc.xml and depends on four runtime packages, win-x64, win-x86, linux-x64 and osx-arm64; each carries runtimes/&lt;rid&gt;/native/ with the NetOcc* and TK* libraries and OCCT's dependencies.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="416" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Connectors, before the boxes. -->
        <g fill="none" stroke="#a6a6a6" stroke-width="1.2">
          <path d="M400,88 V118" marker-end="url(#arrow)"/>
          <path d="M280,152 H132 Q124,152 124,160 V230" marker-end="url(#arrow)"/>
          <path d="M308,184 V230" marker-end="url(#arrow)"/>
          <path d="M492,184 V230" marker-end="url(#arrow)"/>
          <path d="M520,152 H668 Q676,152 676,160 V230" marker-end="url(#arrow)"/>
          <path d="M124,288 V318" marker-end="url(#arrow)"/>
          <path d="M308,288 V318" marker-end="url(#arrow)"/>
          <path d="M492,288 V318" marker-end="url(#arrow)"/>
          <path d="M676,288 V318" marker-end="url(#arrow)"/>
        </g>

        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#e6e6e6" text-anchor="middle">
          <!-- The app: input. -->
          <rect x="320" y="40" width="160" height="48" rx="6" fill="#373737" stroke="#8c8c8c"/>
          <text x="400" y="68">your app</text>

          <!-- NetOcc: focal, the one package an app references. -->
          <rect x="280" y="120" width="240" height="64" rx="6" fill="#33261f" stroke="#f08a59"/>
          <text x="400" y="142">NetOcc</text>

          <!-- The four runtime packages. -->
          <rect x="44" y="232" width="160" height="56" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="124" y="256">NetOcc.runtime.</text>
          <text x="124" y="272">win-x64</text>
          <rect x="228" y="232" width="160" height="56" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="308" y="256">NetOcc.runtime.</text>
          <text x="308" y="272">win-x86</text>
          <rect x="412" y="232" width="160" height="56" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="492" y="256">NetOcc.runtime.</text>
          <text x="492" y="272">linux-x64</text>
          <rect x="596" y="232" width="160" height="56" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="676" y="256">NetOcc.runtime.</text>
          <text x="676" y="272">osx-arm64</text>

          <!-- What each runtime package holds. -->
          <rect x="44" y="320" width="712" height="56" rx="6" fill="#2c2c2c" stroke="#a6a6a6"/>
          <text x="400" y="344">runtimes/&lt;rid&gt;/native/</text>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#a6a6a6" text-anchor="middle">
          <text x="400" y="158">NetOcc.dll for net35 ... net10.0</text>
          <text x="400" y="171">NetOcc.xml</text>
          <text x="400" y="360">NetOcc* and TK* libraries, OCCT's dependencies</text>
        </g>
        <rect x="52" y="328" width="32" height="12" rx="2" fill="none" stroke="rgba(166,166,166,0.48)" stroke-width="0.8"/>
        <text x="68" y="337" fill="#a6a6a6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EACH</text>
      </g></svg>
