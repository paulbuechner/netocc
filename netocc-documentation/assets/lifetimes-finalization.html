<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalization</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · lifetimes.md</p>
    <h1>Finalization</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifetimes-finalization-title lifetimes-finalization-desc">
        <title id="lifetimes-finalization-title">Finalization</title>
        <desc id="lifetimes-finalization-desc">Your code creates a proxy, which creates its native object; the proxy deletes the native object, or releases its reference, either when your code calls Dispose() or when the garbage collector runs its finalizer on the finalizer thread.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines: your code 124, garbage collector 308, proxy 492, native object 676. -->
        <g stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3">
          <line x1="124" y1="96" x2="124" y2="512"/>
          <line x1="308" y1="96" x2="308" y2="512"/>
          <line x1="492" y1="96" x2="492" y2="512"/>
          <line x1="676" y1="96" x2="676" y2="512"/>
        </g>

        <!-- ALT fragment over all four lifelines. -->
        <rect x="64" y="216" width="672" height="272" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="64" y="216" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="84" y="228" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="76" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[disposed]</text>
        <line x1="72" y1="360" x2="728" y2="360" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="76" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[dropped]</text>

        <!-- Activation bars on the proxy. -->
        <g>
          <rect x="488" y="136" width="8" height="64" fill="#f5f5f5"/>
          <rect x="488" y="280" width="8" height="64" fill="#f5f5f5"/>
          <rect x="488" y="416" width="8" height="56" fill="#f5f5f5"/>
        </g>
        <g fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8">
          <rect x="488" y="136" width="8" height="64"/>
          <rect x="488" y="280" width="8" height="64"/>
          <rect x="488" y="416" width="8" height="56"/>
        </g>

        <!-- Messages. -->
        <line x1="124" y1="144" x2="488" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="496" y1="192" x2="676" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="124" y1="288" x2="488" y2="288" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="496" y1="336" x2="676" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="308" y1="424" x2="488" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="496" y1="464" x2="676" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle">
          <rect x="200" y="124" width="32" height="12" rx="2" fill="#f5f5f5"/>
          <text x="216" y="133" fill="#5a6580">NEW</text>

          <rect x="560" y="172" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="584" y="181" fill="#5a6580">CREATE</text>

          <rect x="184" y="256" width="64" height="24" rx="2" fill="#f1f1f1"/>
          <text x="216" y="265" fill="#bf4520">CALL</text>
          <text x="216" y="276" fill="#bf4520" font-size="9" letter-spacing="0">Dispose()</text>

          <rect x="540" y="304" width="88" height="24" rx="2" fill="#f1f1f1"/>
          <text x="584" y="313" fill="#5a6580">DELETE</text>
          <text x="584" y="324" fill="#5a6580">OR RELEASE REF</text>

          <rect x="360" y="392" width="80" height="24" rx="2" fill="#f1f1f1"/>
          <text x="400" y="401" fill="#5a6580">FINALIZER</text>
          <text x="400" y="412" fill="#5a6580">ON GC THREAD</text>

          <rect x="540" y="432" width="88" height="24" rx="2" fill="#f1f1f1"/>
          <text x="584" y="441" fill="#5a6580">DELETE</text>
          <text x="584" y="452" fill="#5a6580">OR RELEASE REF</text>
        </g>

        <!-- Actors, after the lifelines; the proxy is focal. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="48" y="40" width="152" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
          <text x="124" y="64" fill="#2d3142" font-size="12" font-weight="600">your code</text>
          <text x="124" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">C#</text>

          <rect x="232" y="40" width="152" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
          <text x="308" y="64" fill="#2d3142" font-size="12" font-weight="600">garbage collector</text>
          <text x="308" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">finalizer thread</text>

          <rect x="416" y="40" width="152" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="416" y="40" width="152" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="492" y="64" fill="#2d3142" font-size="12" font-weight="600">proxy</text>
          <text x="492" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">.NET heap</text>

          <rect x="600" y="40" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="676" y="64" fill="#2d3142" font-size="12" font-weight="600">native object</text>
          <text x="676" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">native heap</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
