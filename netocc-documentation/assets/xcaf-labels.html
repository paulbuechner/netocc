<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An XCAF document's label tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · xcaf.md</p>
    <h1>An XCAF document's label tree</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="xcaf-labels-title xcaf-labels-desc">
        <title id="xcaf-labels-title">An XCAF document's label tree</title>
        <desc id="xcaf-labels-desc">Under the main label 0:1, the shapes, colors and layers labels belong to XCAFDoc_ShapeTool, XCAFDoc_ColorTool and XCAFDoc_LayerTool; the shapes label holds the parts plate and post and the assembly table, whose components refer to the plate at its place and to the post at four places.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors first: the label tree, solid. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M364,84 V100 A8,8 0 0 1 356,108 H136 A8,8 0 0 0 128,116 V136"/>
          <path d="M400,84 V136"/>
          <path d="M436,84 V100 A8,8 0 0 0 444,108 H672 A8,8 0 0 1 680,116 V136"/>
          <path d="M176,188 V240"/>
          <path d="M68,188 V342 A8,8 0 0 0 76,350 H96"/>
          <path d="M56,188 V426 A8,8 0 0 0 64,434 H96"/>
          <path d="M256,424 H492 A8,8 0 0 0 500,416 V376"/>
          <path d="M256,444 H616 A8,8 0 0 0 624,436 V274 A8,8 0 0 0 616,266 H600"/>
        </g>
        <!-- Components refer to their parts: dashed. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)">
          <path d="M400,266 H256"/>
          <path d="M400,350 H256"/>
        </g>
        <g fill="#f5f5f5">
          <rect x="300" y="246" width="56" height="12" rx="2"/>
          <rect x="300" y="330" width="56" height="12" rx="2"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" text-anchor="middle" letter-spacing="0.08em">
          <text x="328" y="255">REFERS TO</text>
          <text x="328" y="339">REFERS TO</text>
        </g>

        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <!-- Main label and its three tool labels. -->
          <rect x="328" y="40" width="144" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="400" y="66" fill="#2d3142" font-size="12" font-weight="600">0:1 main</text>

          <rect x="40" y="136" width="176" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="128" y="158" fill="#2d3142" font-size="12" font-weight="600">0:1:1 shapes</text>
          <text x="128" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">XCAFDoc_ShapeTool</text>

          <rect x="320" y="136" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="400" y="158" fill="#2d3142" font-size="12" font-weight="600">0:1:2 colors</text>
          <text x="400" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">XCAFDoc_ColorTool</text>

          <rect x="600" y="136" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="680" y="158" fill="#2d3142" font-size="12" font-weight="600">0:1:3 layers</text>
          <text x="680" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">XCAFDoc_LayerTool</text>

          <!-- Shapes: two parts and the assembly (focal). -->
          <rect x="96" y="240" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="176" y="262" fill="#2d3142" font-size="12" font-weight="600">0:1:1:1 plate</text>
          <text x="176" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">a part: a shape</text>

          <rect x="96" y="324" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="176" y="346" fill="#2d3142" font-size="12" font-weight="600">0:1:1:2 post</text>
          <text x="176" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">a part</text>

          <rect x="96" y="408" width="160" height="52" rx="6" fill="#f5f5f5"/>
          <rect x="96" y="408" width="160" height="52" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="176" y="430" fill="#2d3142" font-size="12" font-weight="600">0:1:1:3 table</text>
          <text x="176" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">an assembly</text>

          <!-- The assembly's components. -->
          <rect x="400" y="240" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="500" y="262" fill="#2d3142" font-size="12" font-weight="600">0:1:1:3:1</text>
          <text x="500" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">a component: plate at its place</text>

          <rect x="400" y="324" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="500" y="346" fill="#2d3142" font-size="12" font-weight="600">0:1:1:3:2 ... 0:1:1:3:5</text>
          <text x="500" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">components: post, four places</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
