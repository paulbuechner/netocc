<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checking and repairing</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · analysis.md</p>
    <h1>Checking and repairing</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="analysis-repair-title analysis-repair-desc">
        <title id="analysis-repair-title">Checking and repairing</title>
        <desc id="analysis-repair-desc">BRepCheck_Analyzer checks a shape from a file: a valid one is used as it is, an invalid one is fixed by ShapeFix_Shape, as are loose faces once BRepBuilderAPI_Sewing joins them into shells, and ShapeUpgrade_UnifySameDomain merges split faces before use.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors first. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M196,88 V140"/>
          <path d="M492,88 V120"/>
          <path d="M492,216 V256"/>
          <path d="M196,196 V276 Q196,284 204,284 H396"/>
          <path d="M492,312 V352"/>
          <path d="M492,408 V448"/>
          <path d="M596,168 H684 Q692,168 692,176 V464 Q692,472 684,472 H540"/>
        </g>

        <!-- Branch labels, masked, 8px off their strokes. -->
        <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#5a6580" text-anchor="middle">
          <rect x="500" y="230" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="524" y="239">INVALID</text>
          <rect x="620" y="148" width="40" height="12" rx="2" fill="#f5f5f5"/>
          <text x="640" y="157">VALID</text>
        </g>

        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <!-- Starts and end: ovals. -->
          <rect x="132" y="40" width="128" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
          <text x="196" y="68" fill="#2d3142" font-size="12" font-weight="600">loose faces</text>

          <rect x="408" y="40" width="168" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
          <text x="492" y="68" fill="#2d3142" font-size="12" font-weight="600">shape from a file</text>

          <rect x="444" y="448" width="96" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
          <text x="492" y="476" fill="#2d3142" font-size="12" font-weight="600">use it</text>

          <!-- The check. -->
          <polygon points="492,120 596,168 492,216 388,168" fill="#ffffff" stroke="#2d3142"/>
          <text x="492" y="169" fill="#2d3142" font-size="12" font-weight="600">BRepCheck_Analyzer</text>
          <text x="492" y="183" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">IsValid()</text>

          <!-- Steps. -->
          <rect x="108" y="140" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="196" y="164" fill="#2d3142" font-size="12" font-weight="600">BRepBuilderAPI_Sewing</text>
          <text x="196" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">joins them into shells</text>

          <!-- Focal: the repair both paths go through. -->
          <rect x="396" y="256" width="192" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="492" y="280" fill="#2d3142" font-size="12" font-weight="600">ShapeFix_Shape</text>
          <text x="492" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">tolerances, orientation, wires</text>

          <rect x="378" y="352" width="228" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="492" y="376" fill="#2d3142" font-size="12" font-weight="600">ShapeUpgrade_UnifySameDomain</text>
          <text x="492" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">merges split faces</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
