<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>netocc-core's build steps</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · building.md</p>
    <h1>netocc-core's build steps</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 224" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="building-steps-title building-steps-desc">
        <title id="building-steps-title">netocc-core's build steps</title>
        <desc id="building-steps-desc">build.py's steps in order: tools installs SWIG, occt builds OCCT through vcpkg, generate runs SWIG over the .i files, native builds NetOcc*.dll, then test on every framework and docs writes NetOcc.xml, and pack makes the .nupkg files.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors, before the boxes: test and docs both run on the natives, pack needs both. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2">
          <path d="M140,112 H162" marker-end="url(#arrow)"/>
          <path d="M264,112 H286" marker-end="url(#arrow)"/>
          <path d="M388,112 H410" marker-end="url(#arrow)"/>
          <path d="M512,92 H534" marker-end="url(#arrow)"/>
          <path d="M512,132 H534" marker-end="url(#arrow)"/>
          <path d="M636,92 H658" marker-end="url(#arrow)"/>
          <path d="M636,132 H658" marker-end="url(#arrow)"/>
        </g>

        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">
          <rect x="40" y="80" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="90" y="104">tools</text>
          <rect x="164" y="80" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="214" y="104">occt</text>
          <rect x="288" y="80" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="338" y="104">generate</text>
          <rect x="412" y="80" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="462" y="104">native</text>
          <rect x="536" y="40" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="586" y="64">test</text>
          <rect x="536" y="120" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="586" y="144">docs</text>
          <rect x="660" y="80" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="710" y="104">pack</text>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">
          <text x="90" y="120">SWIG</text>
          <text x="214" y="120">OCCT via</text>
          <text x="214" y="132">vcpkg</text>
          <text x="338" y="120">SWIG over</text>
          <text x="338" y="132">the .i files</text>
          <text x="462" y="120">NetOcc*.dll</text>
          <text x="586" y="80">every</text>
          <text x="586" y="92">framework</text>
          <text x="586" y="160">NetOcc.xml</text>
          <text x="710" y="120">.nupkg</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
