<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="topology-geometry-title topology-geometry-desc" width="800" height="460">
        <title id="topology-geometry-title">Geometry behind the topology</title>
        <desc id="topology-geometry-desc">BRep_Tool reads the geometry behind the topology: Pnt gives a vertex's gp_Pnt, Curve and CurveOnSurface an edge's Geom_Curve with its range and its Geom2d_Curve on each face, Surface and Triangulation a face's Geom_Surface and Poly_Triangulation.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="460" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Column headings. -->
        <g font-family="'Geist', sans-serif" font-size="14" font-weight="600" fill="#e6e6e6" text-anchor="middle">
          <text x="180" y="56">Topology</text>
          <text x="380" y="56">BRep_Tool</text>
          <text x="600" y="56">Geometry</text>
        </g>

        <!-- Connectors first: a BRep_Tool method from each topology type to its geometry. -->
        <line x1="260" y1="100" x2="500" y2="100" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="366" y="82" width="28" height="12" rx="2" fill="#171717"/>
        <text x="380" y="91" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Pnt</text>
        <line x1="260" y1="180" x2="500" y2="180" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="360" y="162" width="40" height="12" rx="2" fill="#171717"/>
        <text x="380" y="171" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Curve</text>
        <line x1="260" y1="248" x2="500" y2="248" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="336" y="230" width="88" height="12" rx="2" fill="#171717"/>
        <text x="380" y="239" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CurveOnSurface</text>
        <line x1="260" y1="328" x2="500" y2="328" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="354" y="310" width="52" height="12" rx="2" fill="#171717"/>
        <text x="380" y="319" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Surface</text>
        <line x1="260" y1="396" x2="500" y2="396" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="338" y="378" width="84" height="12" rx="2" fill="#171717"/>
        <text x="380" y="387" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Triangulation</text>

        <!-- Topology: one box per type, as tall as the geometry it carries. -->
        <g font-family="'Geist', sans-serif">
          <rect x="100" y="76" width="160" height="48" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="180" y="104" fill="#e6e6e6" font-size="12" font-weight="600" text-anchor="middle">TopoDS_Vertex</text>
          <rect x="100" y="156" width="160" height="116" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="180" y="218" fill="#e6e6e6" font-size="12" font-weight="600" text-anchor="middle">TopoDS_Edge</text>
          <rect x="100" y="304" width="160" height="116" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="180" y="366" fill="#e6e6e6" font-size="12" font-weight="600" text-anchor="middle">TopoDS_Face</text>
        </g>

        <!-- Geometry: store treatment. -->
        <g font-family="'Geist', sans-serif">
          <rect x="500" y="76" width="200" height="48" rx="6" fill="#171717"/>
          <rect x="500" y="76" width="200" height="48" rx="6" fill="rgba(230,230,230,0.05)" stroke="#a6a6a6"/>
          <text x="600" y="104" fill="#e6e6e6" font-size="12" font-weight="600" text-anchor="middle">gp_Pnt</text>
          <rect x="500" y="156" width="200" height="48" rx="6" fill="#171717"/>
          <rect x="500" y="156" width="200" height="48" rx="6" fill="rgba(230,230,230,0.05)" stroke="#a6a6a6"/>
          <text x="600" y="178" fill="#e6e6e6" font-size="12" font-weight="600" text-anchor="middle">Geom_Curve</text>
          <text x="600" y="193" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ range first..last</text>
          <rect x="500" y="224" width="200" height="48" rx="6" fill="#171717"/>
          <rect x="500" y="224" width="200" height="48" rx="6" fill="rgba(230,230,230,0.05)" stroke="#a6a6a6"/>
          <text x="600" y="246" fill="#e6e6e6" font-size="12" font-weight="600" text-anchor="middle">Geom2d_Curve</text>
          <text x="600" y="261" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">on each face</text>
          <rect x="500" y="304" width="200" height="48" rx="6" fill="#171717"/>
          <rect x="500" y="304" width="200" height="48" rx="6" fill="rgba(230,230,230,0.05)" stroke="#a6a6a6"/>
          <text x="600" y="332" fill="#e6e6e6" font-size="12" font-weight="600" text-anchor="middle">Geom_Surface</text>
          <rect x="500" y="372" width="200" height="48" rx="6" fill="#171717"/>
          <rect x="500" y="372" width="200" height="48" rx="6" fill="rgba(230,230,230,0.05)" stroke="#a6a6a6"/>
          <text x="600" y="400" fill="#e6e6e6" font-size="12" font-weight="600" text-anchor="middle">Poly_Triangulation</text>
        </g>
      </g></svg>
