<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="introduction-layers-title introduction-layers-desc" width="800" height="432">
        <title id="introduction-layers-title">OCCT's layers</title>
        <desc id="introduction-layers-desc">Values, geometry, topology and algorithms build on each other; files, documents and 3D views sit on the algorithms, and documents read and write through files.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="432" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors first: documents read and write through files. -->
        <path d="M528,76 H560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- L5: the three consumers of the algorithms. -->
        <g font-family="'Geist', sans-serif">
          <rect x="120" y="40" width="184" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="212" y="70" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">3D views</text>
          <text x="212" y="88" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">V3d · AIS · OpenGl</text>

          <rect x="344" y="40" width="184" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="436" y="64" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Documents</text>
          <text x="436" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TDocStd · TDF (OCAF)</text>
          <text x="436" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">XCAFDoc (XCAF)</text>

          <rect x="568" y="40" width="192" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="664" y="64" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Files</text>
          <text x="664" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">STEPControl · IGESControl</text>
          <text x="664" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">StlAPI · RWGltf</text>
        </g>

        <!-- L1-L4: the stack, bands with hairline dividers; algorithms is focal. -->
        <rect x="120" y="128" width="640" height="256" rx="6" fill="#ffffff" stroke="#4f5d75"/>
        <line x1="120" y1="256" x2="760" y2="256" stroke="rgba(45,49,66,0.12)"/>
        <line x1="120" y1="320" x2="760" y2="320" stroke="rgba(45,49,66,0.12)"/>
        <path d="M120,192 V134 A6,6 0 0 1 126,128 H754 A6,6 0 0 1 760,134 V192 Z" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>

        <g font-family="'Geist', sans-serif">
          <text x="144" y="165" fill="#2d3142" font-size="14" font-weight="600">Algorithms</text>
          <text x="736" y="157" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">BRepPrimAPI · BRepAlgoAPI · BRepFilletAPI</text>
          <text x="736" y="171" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">BRepMesh · ShapeFix · BRepGProp</text>

          <text x="144" y="229" fill="#2d3142" font-size="14" font-weight="600">Topology</text>
          <text x="736" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">TopoDS · TopExp · BRep</text>

          <text x="144" y="293" fill="#2d3142" font-size="14" font-weight="600">Geometry</text>
          <text x="736" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Geom · Geom2d · GeomAPI</text>

          <text x="144" y="357" fill="#2d3142" font-size="14" font-weight="600">Values</text>
          <text x="736" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">gp · math · Bnd</text>
        </g>

        <!-- Index tags in the left gutter, bottom-up. -->
        <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.08em" text-anchor="middle">
          <rect x="68" y="70" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="82" y="79" fill="#4f5d75">L5</text>
          <rect x="68" y="154" width="28" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8"/>
          <text x="82" y="163" fill="#bf4520">L4</text>
          <rect x="68" y="218" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="82" y="227" fill="#4f5d75">L3</text>
          <rect x="68" y="282" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="82" y="291" fill="#4f5d75">L2</text>
          <rect x="68" y="346" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="82" y="355" fill="#4f5d75">L1</text>
        </g>

        <text x="120" y="408" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">EACH LAYER BUILDS ON THE ONES BELOW IT</text>
      </g></svg>
