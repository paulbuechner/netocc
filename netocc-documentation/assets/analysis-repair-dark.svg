<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="analysis-repair-title analysis-repair-desc" width="800" height="536">
        <title id="analysis-repair-title">Checking and repairing</title>
        <desc id="analysis-repair-desc">BRepCheck_Analyzer checks a shape from a file: a valid one is used as it is, an invalid one is fixed by ShapeFix_Shape, as are loose faces once BRepBuilderAPI_Sewing joins them into shells, and ShapeUpgrade_UnifySameDomain merges split faces before use.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="536" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Connectors first. -->
        <g fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M196,88 V140"/>
          <path d="M492,88 V120"/>
          <path d="M492,216 V256"/>
          <path d="M196,196 V276 Q196,284 204,284 H396"/>
          <path d="M492,312 V352"/>
          <path d="M492,408 V448"/>
          <path d="M596,168 H684 Q692,168 692,176 V464 Q692,472 684,472 H540"/>
        </g>

        <!-- Branch labels, masked, 8px off their strokes. -->
        <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#8c8c8c" text-anchor="middle">
          <rect x="500" y="230" width="48" height="12" rx="2" fill="#171717"/>
          <text x="524" y="239">INVALID</text>
          <rect x="620" y="148" width="40" height="12" rx="2" fill="#171717"/>
          <text x="640" y="157">VALID</text>
        </g>

        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <!-- Starts and end: ovals. -->
          <rect x="132" y="40" width="128" height="48" rx="20" fill="rgba(230,230,230,0.03)" stroke="rgba(230,230,230,0.30)"/>
          <text x="196" y="68" fill="#e6e6e6" font-size="12" font-weight="600">loose faces</text>

          <rect x="408" y="40" width="168" height="48" rx="20" fill="rgba(230,230,230,0.03)" stroke="rgba(230,230,230,0.30)"/>
          <text x="492" y="68" fill="#e6e6e6" font-size="12" font-weight="600">shape from a file</text>

          <rect x="444" y="448" width="96" height="48" rx="20" fill="rgba(230,230,230,0.03)" stroke="rgba(230,230,230,0.30)"/>
          <text x="492" y="476" fill="#e6e6e6" font-size="12" font-weight="600">use it</text>

          <!-- The check. -->
          <polygon points="492,120 596,168 492,216 388,168" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="492" y="169" fill="#e6e6e6" font-size="12" font-weight="600">BRepCheck_Analyzer</text>
          <text x="492" y="183" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">IsValid()</text>

          <!-- Steps. -->
          <rect x="108" y="140" width="176" height="56" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="196" y="164" fill="#e6e6e6" font-size="12" font-weight="600">BRepBuilderAPI_Sewing</text>
          <text x="196" y="180" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">joins them into shells</text>

          <!-- Focal: the repair both paths go through. -->
          <rect x="396" y="256" width="192" height="56" rx="6" fill="rgba(240,138,89,0.13)" stroke="#f08a59"/>
          <text x="492" y="280" fill="#e6e6e6" font-size="12" font-weight="600">ShapeFix_Shape</text>
          <text x="492" y="296" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">tolerances, orientation, wires</text>

          <rect x="378" y="352" width="228" height="56" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="492" y="376" fill="#e6e6e6" font-size="12" font-weight="600">ShapeUpgrade_UnifySameDomain</text>
          <text x="492" y="392" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">merges split faces</text>
        </g>
      </g></svg>
