<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mapping-types-title mapping-types-desc" width="800" height="452">
        <title id="mapping-types-title">What a C++ type becomes</title>
        <desc id="mapping-types-desc">Standard_Transient subclasses and all other classes become C# classes, holding one reference or owning the object; fixed-layout values become C# structs with the same memory layout; enums become C# enums; namespace functions become static classes.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="452" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Zones: the C++ side and the C# side. -->
        <rect x="40" y="40" width="280" height="372" rx="8" fill="rgba(230,230,230,0.04)" stroke="rgba(230,230,230,0.18)" stroke-width="0.8"/>
        <text x="60" y="57" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">C++ TYPE</text>
        <rect x="560" y="40" width="200" height="372" rx="8" fill="rgba(230,230,230,0.04)" stroke="rgba(230,230,230,0.18)" stroke-width="0.8"/>
        <text x="580" y="57" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">C# TYPE</text>

        <!-- Connectors first, one per row; labels masked above their line. -->
        <g fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M300,96 H577"/>
          <path d="M300,164 H577"/>
          <path d="M300,232 H577"/>
          <path d="M300,300 H577"/>
          <path d="M300,368 H577"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#8c8c8c" text-anchor="middle" letter-spacing="0.06em">
          <rect x="396" y="76" width="88" height="12" rx="2" fill="#171717"/>
          <text x="440" y="85">HOLDS ONE REF</text>
          <rect x="400" y="144" width="80" height="12" rx="2" fill="#171717"/>
          <text x="440" y="153">OWNS OBJECT</text>
          <rect x="400" y="212" width="80" height="12" rx="2" fill="#171717"/>
          <text x="440" y="221">SAME LAYOUT</text>
        </g>

        <!-- C++ kinds, with OCCT examples. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="60" y="72" width="240" height="48" rx="6" fill="#171717"/>
          <rect x="60" y="72" width="240" height="48" rx="6" fill="rgba(230,230,230,0.06)" stroke="rgba(230,230,230,0.38)"/>
          <text x="180" y="92" fill="#e6e6e6" font-size="12" font-weight="600">Standard_Transient subclass</text>
          <text x="180" y="107" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">Geom_Circle, AIS_Shape</text>

          <rect x="60" y="140" width="240" height="48" rx="6" fill="#171717"/>
          <rect x="60" y="140" width="240" height="48" rx="6" fill="rgba(230,230,230,0.06)" stroke="rgba(230,230,230,0.38)"/>
          <text x="180" y="160" fill="#e6e6e6" font-size="12" font-weight="600">any other class</text>
          <text x="180" y="175" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">TopoDS_Shape, BRepPrimAPI_MakeBox</text>

          <rect x="60" y="208" width="240" height="48" rx="6" fill="#171717"/>
          <rect x="60" y="208" width="240" height="48" rx="6" fill="rgba(230,230,230,0.06)" stroke="rgba(230,230,230,0.38)"/>
          <text x="180" y="228" fill="#e6e6e6" font-size="12" font-weight="600">fixed-layout value</text>
          <text x="180" y="243" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">gp_Pnt, Bnd_Box, Quantity_Color</text>

          <rect x="60" y="276" width="240" height="48" rx="6" fill="#171717"/>
          <rect x="60" y="276" width="240" height="48" rx="6" fill="rgba(230,230,230,0.06)" stroke="rgba(230,230,230,0.38)"/>
          <text x="180" y="304" fill="#e6e6e6" font-size="12" font-weight="600">enum</text>

          <rect x="60" y="344" width="240" height="48" rx="6" fill="#171717"/>
          <rect x="60" y="344" width="240" height="48" rx="6" fill="rgba(230,230,230,0.06)" stroke="rgba(230,230,230,0.38)"/>
          <text x="180" y="364" fill="#e6e6e6" font-size="12" font-weight="600">namespace functions</text>
          <text x="180" y="379" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">TopoDS::Face</text>
        </g>

        <!-- C# results; both kinds of class land in one; the struct is focal. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="580" y="72" width="160" height="116" rx="6" fill="#171717"/>
          <rect x="580" y="72" width="160" height="116" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="660" y="134" fill="#e6e6e6" font-size="12" font-weight="600">C# class</text>

          <rect x="580" y="208" width="160" height="48" rx="6" fill="#171717"/>
          <rect x="580" y="208" width="160" height="48" rx="6" fill="rgba(240,138,89,0.13)" stroke="#f08a59"/>
          <text x="660" y="236" fill="#e6e6e6" font-size="12" font-weight="600">C# struct</text>

          <rect x="580" y="276" width="160" height="48" rx="6" fill="#171717"/>
          <rect x="580" y="276" width="160" height="48" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="660" y="304" fill="#e6e6e6" font-size="12" font-weight="600">C# enum</text>

          <rect x="580" y="344" width="160" height="48" rx="6" fill="#171717"/>
          <rect x="580" y="344" width="160" height="48" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="660" y="372" fill="#e6e6e6" font-size="12" font-weight="600">static class</text>
        </g>
      </g></svg>
