<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="getting-started-first-part-title getting-started-first-part-desc" width="800" height="296">
        <title id="getting-started-first-part-title">A first part</title>
        <desc id="getting-started-first-part-desc">A box and a cylinder are cut into a block with a hole, which MakeFillet rounds; the rounded part is measured with VolumeProperties, written as a STEP file, and meshed with IncrementalMesh for an STL file.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="296" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Connectors first. -->
        <g fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M156,108 H168 Q176,108 176,116 V132 Q176,140 184,140 H196"/>
          <path d="M156,188 H168 Q176,188 176,180 V164 Q176,156 184,156 H196"/>
          <path d="M284,148 H324"/>
          <path d="M428,134 H440 Q448,134 448,126 V76 Q448,68 456,68 H468"/>
          <path d="M428,148 H468"/>
          <path d="M428,162 H440 Q448,162 448,170 V220 Q448,228 456,228 H468"/>
          <path d="M612,228 H652"/>
        </g>

        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <!-- The two primitives. -->
          <rect x="44" y="80" width="112" height="56" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="100" y="104" fill="#e6e6e6" font-size="12" font-weight="600">MakeBox</text>
          <text x="100" y="120" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">BRepPrimAPI</text>

          <rect x="44" y="160" width="112" height="56" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="100" y="184" fill="#e6e6e6" font-size="12" font-weight="600">MakeCylinder</text>
          <text x="100" y="200" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">BRepPrimAPI</text>

          <rect x="196" y="120" width="88" height="56" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="240" y="144" fill="#e6e6e6" font-size="12" font-weight="600">Cut</text>
          <text x="240" y="160" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">BRepAlgoAPI</text>

          <!-- Focal: the finished part every output reads. -->
          <rect x="324" y="120" width="104" height="56" rx="6" fill="rgba(240,138,89,0.13)" stroke="#f08a59"/>
          <text x="376" y="144" fill="#e6e6e6" font-size="12" font-weight="600">MakeFillet</text>
          <text x="376" y="160" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">BRepFilletAPI</text>

          <!-- Outputs; files in the store treatment. -->
          <rect x="468" y="40" width="144" height="56" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="540" y="64" fill="#e6e6e6" font-size="12" font-weight="600">VolumeProperties</text>
          <text x="540" y="80" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">BRepGProp</text>

          <rect x="468" y="120" width="144" height="56" rx="6" fill="rgba(230,230,230,0.10)" stroke="#a6a6a6"/>
          <text x="540" y="144" fill="#e6e6e6" font-size="12" font-weight="600">STEP file</text>
          <text x="540" y="160" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">STEPControl_Writer</text>

          <rect x="468" y="200" width="144" height="56" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="540" y="224" fill="#e6e6e6" font-size="12" font-weight="600">IncrementalMesh</text>
          <text x="540" y="240" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">BRepMesh</text>

          <rect x="652" y="200" width="104" height="56" rx="6" fill="rgba(230,230,230,0.10)" stroke="#a6a6a6"/>
          <text x="704" y="224" fill="#e6e6e6" font-size="12" font-weight="600">STL file</text>
          <text x="704" y="240" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">StlAPI_Writer</text>
        </g>
      </g></svg>
