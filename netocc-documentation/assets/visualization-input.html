<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouse input</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · visualization.md</p>
    <h1>Mouse input</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 364" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="visualization-input-title visualization-input-desc">
        <title id="visualization-input-title">Mouse input</title>
        <desc id="visualization-input-desc">The window procedure passes mouse positions to AIS_ViewController, which returns true when something changed; FlushViewEvents then has the controller rotate, pan or zoom the V3d_View's camera and redraw it.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines. -->
        <line x1="140" y1="84" x2="140" y2="324" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/>
        <line x1="420" y1="84" x2="420" y2="324" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/>
        <line x1="660" y1="84" x2="660" y2="324" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/>

        <!-- Activation bars: the controller holds control for each call. -->
        <g fill="#ebebec" stroke="#4f5d75" stroke-width="0.8">
          <rect x="416" y="124" width="8" height="40"/>
          <rect x="416" y="212" width="8" height="88"/>
        </g>

        <!-- Calls: solid. Return: dashed. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <line x1="140" y1="124" x2="416" y2="124"/>
          <line x1="416" y1="164" x2="140" y2="164" stroke-dasharray="5,4"/>
          <line x1="140" y1="212" x2="416" y2="212"/>
          <line x1="424" y1="256" x2="660" y2="256"/>
          <line x1="424" y1="300" x2="660" y2="300"/>
        </g>

        <!-- Message labels on paper masks. -->
        <g fill="#f5f5f5">
          <rect x="156" y="102" width="244" height="14" rx="2"/>
          <rect x="232" y="142" width="92" height="14" rx="2"/>
          <rect x="190" y="190" width="176" height="14" rx="2"/>
          <rect x="504" y="224" width="76" height="24" rx="2"/>
          <rect x="520" y="280" width="44" height="12" rx="2"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#2d3142" text-anchor="middle">
          <text x="278" y="113">UpdateMousePosition(point, buttons, keys)</text>
          <text x="278" y="201">FlushViewEvents(context, view)</text>
        </g>
        <text x="278" y="153" font-family="'Geist Mono', monospace" font-size="9" fill="#2d3142" text-anchor="middle">true<tspan font-size="8" fill="#4f5d75" letter-spacing="0.08em"> IF CHANGED</tspan></text>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" text-anchor="middle" letter-spacing="0.08em">
          <text x="542" y="233">ROTATE, PAN,</text>
          <text x="542" y="244">ZOOM CAMERA</text>
          <text x="542" y="289">REDRAW</text>
        </g>

        <!-- Actors: the window procedure (your code), the controller (focal), the view. -->
        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">
          <rect x="60" y="40" width="160" height="44" rx="6" fill="#f5f5f5"/>
          <rect x="60" y="40" width="160" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
          <text x="140" y="66">window procedure</text>
          <rect x="340" y="40" width="160" height="44" rx="6" fill="#f5f5f5"/>
          <rect x="340" y="40" width="160" height="44" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="420" y="66">AIS_ViewController</text>
          <rect x="580" y="40" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="660" y="66">V3d_View</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
