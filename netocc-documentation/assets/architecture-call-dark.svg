<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-call-title architecture-call-desc" width="800" height="544">
        <title id="architecture-call-title">A call</title>
        <desc id="architecture-call-desc">Constructing BRepPrimAPI_MakeBox from C# P/Invokes into NetOccModelingAlgorithms, which constructs it in TKPrim and hands the pointer to the proxy that owns it; Shape() P/Invokes again and returns a new TopoDS_Shape as a TopoDS_Shape proxy.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="544" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- The managed/native boundary each P/Invoke crosses. -->
        <line x1="396" y1="40" x2="396" y2="504" stroke="rgba(230,230,230,0.24)" stroke-width="1"/>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#8c8c8c" letter-spacing="0.14em">
          <text x="384" y="52" text-anchor="end">MANAGED</text>
          <text x="408" y="52">NATIVE</text>
        </g>

        <!-- Lifelines. -->
        <g stroke="rgba(230,230,230,0.30)" stroke-width="1" stroke-dasharray="3,3">
          <line x1="88" y1="112" x2="88" y2="504"/>
          <line x1="300" y1="112" x2="300" y2="504"/>
          <line x1="504" y1="112" x2="504" y2="504"/>
          <line x1="712" y1="112" x2="712" y2="504"/>
        </g>

        <!-- Activation bars. -->
        <g fill="#2c2c2c" stroke="#a6a6a6" stroke-width="0.8">
          <rect x="296" y="152" width="8" height="160"/>
          <rect x="296" y="360" width="8" height="120"/>
          <rect x="500" y="200" width="8" height="112"/>
          <rect x="500" y="408" width="8" height="36"/>
          <rect x="708" y="236" width="8" height="32"/>
        </g>

        <!-- Messages: calls solid, returns dashed, the two P/Invokes accent. -->
        <g fill="none" stroke-width="1.2">
          <path d="M88,152 H294" stroke="#a6a6a6" marker-end="url(#arrow)"/>
          <path d="M304,200 H498" stroke="#f08a59" marker-end="url(#arrow-accent)"/>
          <path d="M508,236 H706" stroke="#a6a6a6" marker-end="url(#arrow)"/>
          <path d="M708,268 H510" stroke="#a6a6a6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <path d="M500,312 H306" stroke="#a6a6a6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <path d="M88,360 H294" stroke="#a6a6a6" marker-end="url(#arrow)"/>
          <path d="M304,408 H498" stroke="#f08a59" marker-end="url(#arrow-accent)"/>
          <path d="M500,444 H306" stroke="#a6a6a6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <path d="M296,480 H90" stroke="#a6a6a6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        </g>

        <!-- Message labels: code verbatim, prose in caps. -->
        <g fill="#171717">
          <rect x="104" y="132" width="176" height="12" rx="2"/>
          <rect x="312" y="168" width="176" height="24" rx="2"/>
          <rect x="520" y="216" width="176" height="12" rx="2"/>
          <rect x="580" y="248" width="56" height="12" rx="2"/>
          <rect x="360" y="280" width="80" height="24" rx="2"/>
          <rect x="164" y="340" width="56" height="12" rx="2"/>
          <rect x="316" y="376" width="172" height="24" rx="2"/>
          <rect x="352" y="424" width="96" height="12" rx="2"/>
          <rect x="144" y="460" width="96" height="12" rx="2"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#8c8c8c" text-anchor="middle">
          <text x="192" y="141">new BRepPrimAPI_MakeBox(10, 20, 30)</text>
          <text x="400" y="177" fill="#f08a59" letter-spacing="0.06em">P/INVOKE</text>
          <text x="400" y="189">new_BRepPrimAPI_MakeBox(10, 20, 30)</text>
          <text x="608" y="225">new BRepPrimAPI_MakeBox(10, 20, 30)</text>
          <text x="608" y="257" letter-spacing="0.06em">POINTER</text>
          <text x="400" y="289" letter-spacing="0.06em">POINTER,</text>
          <text x="400" y="301" letter-spacing="0.06em">OWNED BY PROXY</text>
          <text x="192" y="349">Shape()</text>
          <text x="400" y="385" fill="#f08a59" letter-spacing="0.06em">P/INVOKE</text>
          <text x="400" y="397">BRepPrimAPI_MakeBox_Shape(pointer)</text>
          <text x="400" y="433">a new TopoDS_Shape</text>
          <text x="192" y="469">TopoDS_Shape proxy</text>
        </g>

        <!-- Participants, after the lifelines. -->
        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#e6e6e6" text-anchor="middle">
          <rect x="40" y="64" width="96" height="48" rx="6" fill="#373737" stroke="#8c8c8c"/>
          <text x="88" y="92">your code</text>
          <rect x="216" y="64" width="168" height="48" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="300" y="85">BRepPrimAPI_MakeBox</text>
          <rect x="410" y="64" width="188" height="48" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="504" y="92">NetOccModelingAlgorithms</text>
          <rect x="664" y="64" width="96" height="48" rx="6" fill="#232323" stroke="rgba(230,230,230,0.38)"/>
          <text x="712" y="85">TKPrim</text>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#a6a6a6" text-anchor="middle">
          <text x="300" y="100">C#</text>
          <text x="712" y="100">OCCT</text>
        </g>
      </g></svg>
