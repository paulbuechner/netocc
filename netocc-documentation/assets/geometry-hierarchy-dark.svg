        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Zones first: curves and surfaces. -->
        <rect x="40" y="120" width="336" height="616" rx="8" fill="rgba(230,230,230,0.02)" stroke="rgba(230,230,230,0.10)" stroke-width="0.8"/>
        <rect x="424" y="120" width="336" height="616" rx="8" fill="rgba(230,230,230,0.02)" stroke="rgba(230,230,230,0.10)" stroke-width="0.8"/>
