<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 776" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="geometry-hierarchy-title geometry-hierarchy-desc" width="800" height="776">
        <title id="geometry-hierarchy-title">Geom's class hierarchy</title>
        <desc id="geometry-hierarchy-desc">Geom_Geometry divides into Geom_Curve, with lines, conics, bounded curves and offset curves, and Geom_Surface, with elementary, swept, offset and bounded surfaces, each down to the concrete classes.</desc><defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
