<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCCT's exception hierarchy</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · errors.md</p>
    <h1>OCCT's exception hierarchy</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="errors-hierarchy-title errors-hierarchy-desc">
        <title id="errors-hierarchy-title">OCCT's exception hierarchy</title>
        <desc id="errors-hierarchy-desc">Standard_Failure is the base of Standard_DomainError, Standard_NumericError, Standard_ProgramError and StdFail_NotDone; Standard_DomainError's subclasses include Standard_ConstructionError and Standard_RangeError, which Standard_OutOfRange, Standard_NegativeValue and Standard_NullValue derive from.</desc>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones: one per subtree of Standard_Failure. -->
        <g fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8">
          <rect x="40" y="112" width="312" height="628" rx="8"/>
          <rect x="480" y="152" width="280" height="208" rx="8"/>
          <rect x="480" y="380" width="280" height="148" rx="8"/>
          <rect x="480" y="548" width="280" height="88" rx="8"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#5a6580">
          <text x="56" y="125">DOMAIN ERRORS</text>
          <text x="496" y="165">NUMERIC ERRORS</text>
          <text x="496" y="393">PROGRAM ERRORS</text>
          <text x="496" y="561">STDFAIL</text>
        </g>

        <!-- Connectors, before the boxes: the trunk from the root, then each parent's spine. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1">
          <path d="M416,80 V592 Q416,600 424,600 H496"/>
          <path d="M416,164 H240"/>
          <path d="M416,204 H496"/>
          <path d="M416,432 H496"/>

          <path d="M72,184 V516 Q72,524 80,524 H88"/>
          <path d="M72,224 H88"/>
          <path d="M72,284 H88"/>
          <path d="M72,344 H88"/>
          <path d="M72,404 H88"/>
          <path d="M72,464 H88"/>

          <path d="M104,544 V696 Q104,704 112,704 H120"/>
          <path d="M104,584 H120"/>
          <path d="M104,644 H120"/>

          <path d="M512,224 V316 Q512,324 520,324 H528"/>
          <path d="M512,264 H528"/>

          <path d="M512,452 V484 Q512,492 520,492 H528"/>
        </g>

        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">
          <!-- Root. -->
          <rect x="324" y="40" width="184" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="416" y="64">Standard_Failure</text>

          <!-- Standard_DomainError and its subtree; it and Standard_ConstructionError are focal. -->
          <rect x="56" y="144" width="184" height="40" rx="6" fill="#f5f5f5" stroke="none"/>
          <rect x="56" y="144" width="184" height="40" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="148" y="168">Standard_DomainError</text>
          <rect x="88" y="204" width="216" height="40" rx="6" fill="#f5f5f5" stroke="none"/>
          <rect x="88" y="204" width="216" height="40" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="196" y="228">Standard_ConstructionError</text>
          <rect x="88" y="264" width="216" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="196" y="288">Standard_NullObject</text>
          <rect x="88" y="324" width="216" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="196" y="348">Standard_NoSuchObject</text>
          <rect x="88" y="384" width="216" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="196" y="408">Standard_TypeMismatch</text>
          <rect x="88" y="444" width="216" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="196" y="468">Standard_DimensionError</text>
          <rect x="88" y="504" width="216" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="196" y="528">Standard_RangeError</text>
          <rect x="120" y="564" width="216" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="228" y="588">Standard_OutOfRange</text>
          <rect x="120" y="624" width="216" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="228" y="648">Standard_NegativeValue</text>
          <rect x="120" y="684" width="216" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="228" y="708">Standard_NullValue</text>

          <!-- Standard_NumericError. -->
          <rect x="496" y="184" width="184" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="588" y="208">Standard_NumericError</text>
          <rect x="528" y="244" width="216" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="636" y="268">Standard_DivideByZero</text>
          <rect x="528" y="304" width="216" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="636" y="328">Standard_Overflow</text>

          <!-- Standard_ProgramError. -->
          <rect x="496" y="412" width="184" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="588" y="436">Standard_ProgramError</text>
          <rect x="528" y="472" width="216" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="636" y="496">Standard_NotImplemented</text>

          <!-- StdFail_NotDone. -->
          <rect x="496" y="580" width="184" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="588" y="604">StdFail_NotDone</text>
        </g>

        <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#5a6580">
          <text x="480" y="720">CATCHING A BASE CLASS</text>
          <text x="480" y="736">CATCHES ITS SUBCLASSES</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
