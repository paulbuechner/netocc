<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ocaf-labels-title ocaf-labels-desc" width="800" height="548">
        <title id="ocaf-labels-title">An OCAF document's label tree</title>
        <desc id="ocaf-labels-desc">A TDocStd_Application holds a TDocStd_Document, whose root label 0 has the main label 0:1 with children 0:1:1 and 0:1:2; 0:1:1 carries a TDataStd_Name and a TDataStd_Real, 0:1:2 a TDataStd_Name and a TNaming_NamedShape.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="548" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Zone: the document's labels (top band) and their attributes (bottom band). -->
        <rect x="40" y="124" width="720" height="356" rx="8" fill="rgba(230,230,230,0.02)" stroke="rgba(230,230,230,0.12)"/>
        <path d="M40,372 H760 V472 A8,8 0 0 1 752,480 H48 A8,8 0 0 1 40,472 Z" fill="rgba(230,230,230,0.03)"/>
        <line x1="40" y1="372" x2="760" y2="372" stroke="rgba(230,230,230,0.12)"/>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#a6a6a6" letter-spacing="0.14em">
          <text x="56" y="144">LABELS</text>
          <text x="56" y="392">ATTRIBUTES</text>
        </g>

        <!-- Connectors first. Parent to child labels: arrows; label to attribute: plain lines. -->
        <path d="M248,66 H304" fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M400,92 V140" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M400,184 V212" fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M372,256 V272 A8,8 0 0 1 364,280 H226 A8,8 0 0 0 218,288 V304" fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M428,256 V272 A8,8 0 0 0 436,280 H574 A8,8 0 0 1 582,288 V304" fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>

        <g fill="none" stroke="#a6a6a6" stroke-width="1">
          <path d="M198,348 V356 A8,8 0 0 1 190,364 H142 A8,8 0 0 0 134,372 V416"/>
          <path d="M238,348 V356 A8,8 0 0 0 246,364 H294 A8,8 0 0 1 302,372 V416"/>
          <path d="M562,348 V356 A8,8 0 0 1 554,364 H506 A8,8 0 0 0 498,372 V416"/>
          <path d="M602,348 V356 A8,8 0 0 0 610,364 H658 A8,8 0 0 1 666,372 V416"/>
        </g>

        <!-- Framework: the application and its document (focal). -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="56" y="40" width="192" height="52" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="152" y="62" fill="#e6e6e6" font-size="12" font-weight="600">TDocStd_Application</text>
          <text x="152" y="78" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">formats, open documents</text>

          <rect x="304" y="40" width="192" height="52" rx="6" fill="#171717"/>
          <rect x="304" y="40" width="192" height="52" rx="6" fill="rgba(240,138,89,0.13)" stroke="#f08a59"/>
          <text x="400" y="62" fill="#e6e6e6" font-size="12" font-weight="600">TDocStd_Document</text>
          <text x="400" y="78" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">undo, redo, file</text>
        </g>

        <!-- Labels, named by their entries. -->
        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#e6e6e6" text-anchor="middle">
          <rect x="320" y="140" width="160" height="44" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="400" y="166">0 root label</text>
          <rect x="320" y="212" width="160" height="44" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="400" y="238">0:1 main label</text>
          <rect x="158" y="304" width="120" height="44" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="218" y="330">0:1:1</text>
          <rect x="522" y="304" width="120" height="44" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="582" y="330">0:1:2</text>
        </g>

        <!-- Attributes: class, then the value it holds. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="56" y="416" width="156" height="44" rx="6" fill="#171717"/>
          <rect x="56" y="416" width="156" height="44" rx="6" fill="rgba(230,230,230,0.05)" stroke="#a6a6a6"/>
          <text x="134" y="434" fill="#e6e6e6" font-size="12" font-weight="600">TDataStd_Name</text>
          <text x="134" y="450" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">width</text>

          <rect x="224" y="416" width="156" height="44" rx="6" fill="#171717"/>
          <rect x="224" y="416" width="156" height="44" rx="6" fill="rgba(230,230,230,0.05)" stroke="#a6a6a6"/>
          <text x="302" y="434" fill="#e6e6e6" font-size="12" font-weight="600">TDataStd_Real</text>
          <text x="302" y="450" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">40.0</text>

          <rect x="420" y="416" width="156" height="44" rx="6" fill="#171717"/>
          <rect x="420" y="416" width="156" height="44" rx="6" fill="rgba(230,230,230,0.05)" stroke="#a6a6a6"/>
          <text x="498" y="434" fill="#e6e6e6" font-size="12" font-weight="600">TDataStd_Name</text>
          <text x="498" y="450" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">part</text>

          <rect x="588" y="416" width="156" height="44" rx="6" fill="#171717"/>
          <rect x="588" y="416" width="156" height="44" rx="6" fill="rgba(230,230,230,0.05)" stroke="#a6a6a6"/>
          <text x="666" y="434" fill="#e6e6e6" font-size="12" font-weight="600">TNaming_NamedShape</text>
          <text x="666" y="450" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">a box</text>
        </g>

        <text x="40" y="508" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">A LABEL CARRIES AT MOST ONE ATTRIBUTE PER CLASS (GUID)</text>
      </g></svg>
