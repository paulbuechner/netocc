<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a STEP reader works</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · data-exchange.md</p>
    <h1>How a STEP reader works</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-exchange-reader-title data-exchange-reader-desc">
        <title id="data-exchange-reader-title">How a STEP reader works</title>
        <desc id="data-exchange-reader-desc">ReadFile has STEPControl_Reader parse the file into a model of entities and returns IFSelect_RetDone; TransferRoots translates each root entity and returns the number of shapes; OneShape returns a TopoDS_Shape, a compound when there are several.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Loop fragment: TransferRoots translates root by root. -->
        <rect x="344" y="272" width="320" height="72" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)"/>

        <!-- Lifelines. -->
        <line x1="160" y1="84" x2="160" y2="476" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/>
        <line x1="400" y1="84" x2="400" y2="476" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/>
        <line x1="640" y1="84" x2="640" y2="476" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/>

        <!-- Activation bars: the reader holds control for each call. -->
        <g fill="#ebebec" stroke="#4f5d75" stroke-width="0.8">
          <rect x="396" y="124" width="8" height="80"/>
          <rect x="396" y="252" width="8" height="120"/>
          <rect x="396" y="412" width="8" height="40"/>
        </g>

        <!-- Loop tab and guard. -->
        <rect x="344" y="272" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)"/>
        <text x="364" y="283" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
        <text x="416" y="286" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[each root entity]</text>

        <!-- Calls: solid. Returns: dashed. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <line x1="160" y1="124" x2="396" y2="124"/>
          <line x1="404" y1="164" x2="640" y2="164"/>
          <line x1="396" y1="204" x2="160" y2="204" stroke-dasharray="5,4"/>
          <line x1="160" y1="252" x2="396" y2="252"/>
          <line x1="404" y1="320" x2="640" y2="320"/>
          <line x1="396" y1="372" x2="160" y2="372" stroke-dasharray="5,4"/>
          <line x1="160" y1="412" x2="396" y2="412"/>
        </g>
        <line x1="396" y1="452" x2="160" y2="452" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Message labels on paper masks. -->
        <g fill="#f5f5f5">
          <rect x="236" y="102" width="84" height="14" rx="2"/>
          <rect x="500" y="144" width="44" height="12" rx="2"/>
          <rect x="228" y="182" width="100" height="14" rx="2"/>
          <rect x="232" y="230" width="92" height="14" rx="2"/>
          <rect x="492" y="300" width="60" height="12" rx="2" fill="#f1f1f1"/>
          <rect x="244" y="352" width="68" height="12" rx="2"/>
          <rect x="244" y="390" width="68" height="14" rx="2"/>
          <rect x="240" y="430" width="76" height="14" rx="2"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#2d3142" text-anchor="middle">
          <text x="278" y="113">ReadFile(path)</text>
          <text x="278" y="193">IFSelect_RetDone</text>
          <text x="278" y="241">TransferRoots()</text>
          <text x="278" y="401">OneShape()</text>
          <text x="278" y="441" fill="#bf4520">TopoDS_Shape</text>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" text-anchor="middle" letter-spacing="0.08em">
          <text x="522" y="153">PARSE</text>
          <text x="522" y="309">TRANSLATE</text>
          <text x="278" y="361">SHAPE COUNT</text>
        </g>

        <!-- Callout below the lifelines: the result when there are several shapes. -->
        <path d="M280,456 V488" fill="none" stroke="rgba(45,49,66,0.40)" stroke-dasharray="4,3"/>
        <circle cx="280" cy="454" r="2" fill="#2d3142"/>
        <text x="280" y="506" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">a compound for several</text>

        <!-- Actors. -->
        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">
          <rect x="72" y="40" width="176" height="44" rx="6" fill="#f5f5f5"/>
          <rect x="72" y="40" width="176" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
          <text x="160" y="66">your code</text>
          <rect x="312" y="40" width="176" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="400" y="66">STEPControl_Reader</text>
          <rect x="552" y="40" width="176" height="44" rx="6" fill="#f5f5f5"/>
          <rect x="552" y="40" width="176" height="44" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="640" y="66">model of entities</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
