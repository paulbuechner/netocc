<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 324" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="modeling-builder-title modeling-builder-desc" width="800" height="324">
        <title id="modeling-builder-title">Builder states</title>
        <desc id="modeling-builder-desc">A modeling builder is configured by its constructor and by Add and Set calls; Build() either succeeds, after which Shape(), Modified() and Generated() give the results, or fails, after which IsDone() is false and Error() says why.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="324" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Transitions first. -->
        <line x1="54" y1="180" x2="168" y2="180" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="77" y="162" width="68" height="12" rx="2" fill="#171717"/>
        <text x="111" y="171" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">new(input)</text>
        <path d="M208,156 V136 Q208,128 216,128 H272 Q280,128 280,136 V156" fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="208" y="110" width="72" height="12" rx="2" fill="#171717"/>
        <text x="244" y="119" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Add, Set...</text>
        <path d="M320,172 H352 Q360,172 360,164 V108 Q360,100 368,100 H500" fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="396" y="82" width="68" height="12" rx="2" fill="#171717"/>
        <text x="430" y="91" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Build() ok</text>
        <path d="M320,188 H352 Q360,188 360,196 V252 Q360,260 368,260 H500" fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="388" y="242" width="84" height="12" rx="2" fill="#171717"/>
        <text x="430" y="251" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Build() fails</text>
        <line x1="628" y1="100" x2="736" y2="100" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="646" y="58" width="72" height="36" rx="2" fill="#171717"/>
        <text x="682" y="68" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Shape()</text>
        <text x="682" y="79" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Modified()</text>
        <text x="682" y="90" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Generated()</text>
        <line x1="628" y1="260" x2="736" y2="260" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="638" y="230" width="88" height="24" rx="2" fill="#171717"/>
        <text x="682" y="239" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IsDone() false</text>
        <text x="682" y="250" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Error(): why</text>

        <!-- Start and end dots. -->
        <circle cx="48" cy="180" r="6" fill="#e6e6e6"/>
        <circle cx="744" cy="100" r="8" fill="#171717" stroke="#e6e6e6"/>
        <circle cx="744" cy="100" r="5" fill="#e6e6e6"/>
        <circle cx="744" cy="260" r="8" fill="#171717" stroke="#e6e6e6"/>
        <circle cx="744" cy="260" r="5" fill="#e6e6e6"/>

        <!-- States; Failed is focal. -->
        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#e6e6e6">
          <rect x="168" y="156" width="152" height="48" rx="8" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="244" y="184">Configured</text>
          <rect x="500" y="76" width="128" height="48" rx="8" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="564" y="104">Done</text>
          <rect x="500" y="236" width="128" height="48" rx="8" fill="#171717"/>
          <rect x="500" y="236" width="128" height="48" rx="8" fill="rgba(240,138,89,0.13)" stroke="#f08a59"/>
          <text x="564" y="264">Failed</text>
        </g>
      </g></svg>
