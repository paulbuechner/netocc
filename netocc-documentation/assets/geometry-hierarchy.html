<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geom's class hierarchy</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · geometry.md</p>
    <h1>Geom's class hierarchy</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 776" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="geometry-hierarchy-title geometry-hierarchy-desc">
        <title id="geometry-hierarchy-title">Geom's class hierarchy</title>
        <desc id="geometry-hierarchy-desc">Geom_Geometry divides into Geom_Curve, with lines, conics, bounded curves and offset curves, and Geom_Surface, with elementary, swept, offset and bounded surfaces, each down to the concrete classes.</desc>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones first: curves and surfaces. -->
        <rect x="40" y="120" width="336" height="616" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="424" y="120" width="336" height="616" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#5a6580">
          <rect x="52" y="124" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="56" y="133">CURVES</text>
          <rect x="436" y="124" width="60" height="12" rx="2" fill="#f5f5f5"/>
          <text x="440" y="133">SURFACES</text>
        </g>

        <!-- Connectors: the root's two branches, then each parent's spine and stubs. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1">
          <path d="M380,80 V92 Q380,100 372,100 H216 Q208,100 208,108 V152"/>
          <path d="M420,80 V92 Q420,100 428,100 H584 Q592,100 592,108 V152"/>

          <path d="M72,192 V644 Q72,652 80,652 H88"/>
          <path d="M72,224 H88"/>
          <path d="M72,276 H88"/>
          <path d="M72,444 H88"/>
          <path d="M104,296 V372 Q104,380 112,380 H120"/>
          <path d="M104,328 H120"/>
          <path d="M104,464 V592 Q104,600 112,600 H120"/>
          <path d="M104,496 H120"/>
          <path d="M104,548 H120"/>

          <path d="M456,192 V536 Q456,544 464,544 H472"/>
          <path d="M456,224 H472"/>
          <path d="M456,416 H472"/>
          <path d="M456,492 H472"/>
          <path d="M488,244 V320 Q488,328 496,328 H504"/>
          <path d="M488,276 H504"/>
          <path d="M488,564 V692 Q488,700 496,700 H504"/>
          <path d="M488,596 H504"/>
          <path d="M488,648 H504"/>
        </g>

        <!-- Classes with subclasses: white, ink stroke. -->
        <g fill="#ffffff" stroke="#2d3142">
          <rect x="340" y="40" width="120" height="40" rx="6"/>
          <rect x="56" y="152" width="304" height="40" rx="6"/>
          <rect x="88" y="256" width="272" height="40" rx="6"/>
          <rect x="88" y="424" width="272" height="40" rx="6"/>
          <rect x="440" y="152" width="304" height="40" rx="6"/>
          <rect x="472" y="204" width="272" height="40" rx="6"/>
          <rect x="472" y="524" width="272" height="40" rx="6"/>
        </g>
        <!-- Leaves: white, thin muted stroke. -->
        <g fill="#ffffff" stroke="#4f5d75" stroke-width="0.8">
          <rect x="88" y="204" width="272" height="40" rx="6"/>
          <rect x="120" y="308" width="240" height="40" rx="6"/>
          <rect x="120" y="360" width="240" height="52" rx="6"/>
          <rect x="120" y="476" width="240" height="40" rx="6"/>
          <rect x="120" y="528" width="240" height="40" rx="6"/>
          <rect x="120" y="580" width="240" height="40" rx="6"/>
          <rect x="88" y="632" width="272" height="40" rx="6"/>
          <rect x="504" y="256" width="240" height="40" rx="6"/>
          <rect x="504" y="308" width="240" height="76" rx="6"/>
          <rect x="472" y="396" width="272" height="64" rx="6"/>
          <rect x="472" y="472" width="272" height="40" rx="6"/>
          <rect x="504" y="576" width="240" height="40" rx="6"/>
          <rect x="504" y="628" width="240" height="40" rx="6"/>
          <rect x="504" y="680" width="240" height="40" rx="6"/>
        </g>

        <!-- Names, then the classes a box groups with it. -->
        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">
          <text x="400" y="64" text-anchor="middle">Geom_Geometry</text>

          <text x="68" y="176">Geom_Curve</text>
          <text x="100" y="228">Geom_Line</text>
          <text x="100" y="280">Geom_Conic</text>
          <text x="132" y="332">Geom_Circle</text>
          <text x="132" y="384">Geom_Ellipse</text>
          <text x="100" y="448">Geom_BoundedCurve</text>
          <text x="132" y="500">Geom_BSplineCurve</text>
          <text x="132" y="552">Geom_BezierCurve</text>
          <text x="132" y="604">Geom_TrimmedCurve</text>
          <text x="100" y="656">Geom_OffsetCurve</text>

          <text x="452" y="176">Geom_Surface</text>
          <text x="484" y="228">Geom_ElementarySurface</text>
          <text x="516" y="280">Geom_Plane</text>
          <text x="516" y="332">Geom_CylindricalSurface</text>
          <text x="484" y="420">Geom_SweptSurface</text>
          <text x="484" y="496">Geom_OffsetSurface</text>
          <text x="484" y="548">Geom_BoundedSurface</text>
          <text x="516" y="600">Geom_BSplineSurface</text>
          <text x="516" y="652">Geom_BezierSurface</text>
          <text x="516" y="704">Geom_RectangularTrimmedSurface</text>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">
          <text x="132" y="398">Geom_Hyperbola · Geom_Parabola</text>
          <text x="516" y="346">Geom_ConicalSurface</text>
          <text x="516" y="358">Geom_SphericalSurface</text>
          <text x="516" y="370">Geom_ToroidalSurface</text>
          <text x="484" y="434">Geom_SurfaceOfLinearExtrusion</text>
          <text x="484" y="446">Geom_SurfaceOfRevolution</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
