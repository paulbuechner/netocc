<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifetimes-borrowed-title lifetimes-borrowed-desc" width="800" height="196">
        <title id="lifetimes-borrowed-title">What stays alive with what</title>
        <desc id="lifetimes-borrowed-desc">The proxy first points into a native element that the map edges (TopTools_IndexedMapOfShape) owns, so first keeps the map alive.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netocc-card"><rect width="800" height="196" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs><g clip-path="url(#netocc-card)">
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors, before the boxes; keeping the map alive is the headline. -->
        <path d="M200,64 H300" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M500,64 H600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M120,88 V128 Q120,136 128,136 H672 Q680,136 680,128 V88" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle">
          <rect x="216" y="44" width="68" height="12" rx="2" fill="#f5f5f5"/>
          <text x="250" y="53" fill="#bf4520">KEEPS ALIVE</text>
          <rect x="530" y="44" width="40" height="12" rx="2" fill="#f5f5f5"/>
          <text x="550" y="53" fill="#5a6580">OWNS</text>
          <rect x="364" y="144" width="72" height="12" rx="2" fill="#f5f5f5"/>
          <text x="400" y="153" fill="#5a6580">POINTS INTO</text>
        </g>

        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="40" y="40" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="120" y="61" fill="#2d3142" font-size="12" font-weight="600">first</text>
          <text x="120" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">a proxy into the map</text>

          <rect x="300" y="40" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="400" y="61" fill="#2d3142" font-size="12" font-weight="600">edges</text>
          <text x="400" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TopTools_IndexedMapOfShape</text>

          <rect x="600" y="40" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="680" y="68" fill="#2d3142" font-size="12" font-weight="600">the native element</text>
        </g>
      </g></svg>
