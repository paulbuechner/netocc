<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A call</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · architecture.md</p>
    <h1>A call</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-call-title architecture-call-desc">
        <title id="architecture-call-title">A call</title>
        <desc id="architecture-call-desc">Constructing BRepPrimAPI_MakeBox from C# P/Invokes into NetOccModelingAlgorithms, which constructs it in TKPrim and hands the pointer to the proxy that owns it; Shape() P/Invokes again and returns a new TopoDS_Shape as a TopoDS_Shape proxy.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- The managed/native boundary each P/Invoke crosses. -->
        <line x1="396" y1="40" x2="396" y2="504" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.14em">
          <text x="384" y="52" text-anchor="end">MANAGED</text>
          <text x="408" y="52">NATIVE</text>
        </g>

        <!-- Lifelines. -->
        <g stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3">
          <line x1="88" y1="112" x2="88" y2="504"/>
          <line x1="300" y1="112" x2="300" y2="504"/>
          <line x1="504" y1="112" x2="504" y2="504"/>
          <line x1="712" y1="112" x2="712" y2="504"/>
        </g>

        <!-- Activation bars. -->
        <g fill="#ebebec" stroke="#4f5d75" stroke-width="0.8">
          <rect x="296" y="152" width="8" height="160"/>
          <rect x="296" y="360" width="8" height="120"/>
          <rect x="500" y="200" width="8" height="112"/>
          <rect x="500" y="408" width="8" height="36"/>
          <rect x="708" y="236" width="8" height="32"/>
        </g>

        <!-- Messages: calls solid, returns dashed, the two P/Invokes accent. -->
        <g fill="none" stroke-width="1.2">
          <path d="M88,152 H294" stroke="#4f5d75" marker-end="url(#arrow)"/>
          <path d="M304,200 H498" stroke="#bf4520" marker-end="url(#arrow-accent)"/>
          <path d="M508,236 H706" stroke="#4f5d75" marker-end="url(#arrow)"/>
          <path d="M708,268 H510" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <path d="M500,312 H306" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <path d="M88,360 H294" stroke="#4f5d75" marker-end="url(#arrow)"/>
          <path d="M304,408 H498" stroke="#bf4520" marker-end="url(#arrow-accent)"/>
          <path d="M500,444 H306" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <path d="M296,480 H90" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        </g>

        <!-- Message labels: code verbatim, prose in caps. -->
        <g fill="#f5f5f5">
          <rect x="104" y="132" width="176" height="12" rx="2"/>
          <rect x="312" y="168" width="176" height="24" rx="2"/>
          <rect x="520" y="216" width="176" height="12" rx="2"/>
          <rect x="580" y="248" width="56" height="12" rx="2"/>
          <rect x="360" y="280" width="80" height="24" rx="2"/>
          <rect x="164" y="340" width="56" height="12" rx="2"/>
          <rect x="316" y="376" width="172" height="24" rx="2"/>
          <rect x="352" y="424" width="96" height="12" rx="2"/>
          <rect x="144" y="460" width="96" height="12" rx="2"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" text-anchor="middle">
          <text x="192" y="141">new BRepPrimAPI_MakeBox(10, 20, 30)</text>
          <text x="400" y="177" fill="#bf4520" letter-spacing="0.06em">P/INVOKE</text>
          <text x="400" y="189">new_BRepPrimAPI_MakeBox(10, 20, 30)</text>
          <text x="608" y="225">new BRepPrimAPI_MakeBox(10, 20, 30)</text>
          <text x="608" y="257" letter-spacing="0.06em">POINTER</text>
          <text x="400" y="289" letter-spacing="0.06em">POINTER,</text>
          <text x="400" y="301" letter-spacing="0.06em">OWNED BY PROXY</text>
          <text x="192" y="349">Shape()</text>
          <text x="400" y="385" fill="#bf4520" letter-spacing="0.06em">P/INVOKE</text>
          <text x="400" y="397">BRepPrimAPI_MakeBox_Shape(pointer)</text>
          <text x="400" y="433">a new TopoDS_Shape</text>
          <text x="192" y="469">TopoDS_Shape proxy</text>
        </g>

        <!-- Participants, after the lifelines. -->
        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">
          <rect x="40" y="64" width="96" height="48" rx="6" fill="#e4e6e8" stroke="#5a6580"/>
          <text x="88" y="92">your code</text>
          <rect x="216" y="64" width="168" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="300" y="85">BRepPrimAPI_MakeBox</text>
          <rect x="410" y="64" width="188" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="504" y="92">NetOccModelingAlgorithms</text>
          <rect x="664" y="64" width="96" height="48" rx="6" fill="#efeff0" stroke="rgba(45,49,66,0.30)"/>
          <text x="712" y="85">TKPrim</text>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">
          <text x="300" y="100">C#</text>
          <text x="712" y="100">OCCT</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
