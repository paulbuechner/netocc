<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triangulating a shape</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · meshing.md</p>
    <h1>Triangulating a shape</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="meshing-triangulation-title meshing-triangulation-desc">
        <title id="meshing-triangulation-title">Triangulating a shape</title>
        <desc id="meshing-triangulation-desc">BRepMesh_IncrementalMesh stores a Poly_Triangulation on each face of a TopoDS_Shape; BRep_Tool.Triangulation reads its nodes and triangles in the face's coordinates, which the location and orientation turn into vertex and index buffers, while StlAPI_Writer, RWGltf_CafWriter and AIS_Shape use the stored triangulation directly.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors first. The main chain runs down; the stored triangulation fans out to its users. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M160,88 V143"/>
          <path d="M160,192 V247"/>
          <path d="M160,296 V351"/>
          <path d="M260,152 H563"/>
          <path d="M260,168 H448 Q456,168 456,176 V212 Q456,220 464,220 H563"/>
          <path d="M260,184 H432 Q440,184 440,192 V280 Q440,288 448,288 H563"/>
        </g>

        <!-- Labels beside the vertical segments: the calls keep their case, they are identifiers. -->
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em">
          <rect x="168" y="110" width="140" height="12" rx="2" fill="#f5f5f5"/>
          <text x="172" y="119">BRepMesh_IncrementalMesh</text>
          <rect x="168" y="208" width="136" height="24" rx="2" fill="#f5f5f5"/>
          <text x="172" y="217">BRep_Tool.Triangulation</text>
          <text x="172" y="228">(face, location)</text>
          <rect x="168" y="312" width="72" height="24" rx="2" fill="#f5f5f5"/>
          <text x="172" y="321">LOCATION,</text>
          <text x="172" y="332">ORIENTATION</text>
        </g>

        <!-- Main chain. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="60" y="40" width="200" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="60" y="40" width="200" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
          <text x="160" y="68" fill="#2d3142" font-size="12" font-weight="600">TopoDS_Shape</text>

          <rect x="60" y="144" width="200" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="60" y="144" width="200" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="160" y="164" fill="#2d3142" font-size="12" font-weight="600">Poly_Triangulation</text>
          <text x="160" y="179" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">on each face</text>

          <rect x="60" y="248" width="200" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="60" y="248" width="200" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="160" y="268" fill="#2d3142" font-size="12" font-weight="600">nodes + triangles</text>
          <text x="160" y="283" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">in the face's coordinates</text>

          <rect x="60" y="352" width="200" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="60" y="352" width="200" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="160" y="380" fill="#2d3142" font-size="12" font-weight="600">vertex and index buffers</text>
        </g>

        <!-- Users of the stored triangulation. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="564" y="128" width="176" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="564" y="128" width="176" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="652" y="156" fill="#2d3142" font-size="12" font-weight="600">StlAPI_Writer</text>

          <rect x="564" y="196" width="176" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="564" y="196" width="176" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="652" y="224" fill="#2d3142" font-size="12" font-weight="600">RWGltf_CafWriter</text>

          <rect x="564" y="264" width="176" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="564" y="264" width="176" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="652" y="284" fill="#2d3142" font-size="12" font-weight="600">AIS_Shape</text>
          <text x="652" y="299" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">shows it, meshes if missing</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
