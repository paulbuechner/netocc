<!DOCTYPE html>

  <style>

<body>

        <desc id="readme-architecture-desc">Bootstrap writes config/toolkits.yaml from OCCT's source; Parse reads it with OCCT's headers and DLLs and config/modules.yaml, Map adds the types netocc-core's hand-written .i files provide, and Emit writes netocc-core's wrapper .i files and module headers and the skip logs.</desc>

          <path d="M224,408 H331"/>
          <path d="M404,344 V375"/>
          <path d="M404,440 V471"/>
          <path d="M476,480 H516 Q524,480 524,472 V428 Q524,420 532,420 H575"/>
          <path d="M476,496 H575"/>
          <path d="M476,512 H516 Q524,512 524,520 V564 Q524,572 532,572 H575"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em">

          <rect x="576" y="548" width="168" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="576" y="548" width="168" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>

        </g>

        <!-- Legend: the two fills that need decoding. -->
        <line x1="40" y1="636" x2="760" y2="636" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

          <rect x="120" y="654" width="20" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>

          <text x="276" y="664">FROM OCCT</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
