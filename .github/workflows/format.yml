# The hand-written C# of every folder in OCCT's style as far as C# has it (.editorconfig, python format.py: ReSharper's
# formatter, pinned in .config/dotnet-tools.json), and the hand-written C++ against .clang-format (OCCT's style). Needs
# no build; generated code (SWIG's output, *.g.cs, netocc-gen's headers) and the generator's golden fixtures are left out.
name: format

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  PYTHONUTF8: "1"

jobs:
  csharp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: C# formatting
        run: python format.py --check

  clang-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pinned: another clang-format version formats some constructs differently
      - name: clang-format
        run: pipx run --spec clang-format==20.1.8 clang-format --dry-run --Werror netocc-core/src/Native/*.cxx
