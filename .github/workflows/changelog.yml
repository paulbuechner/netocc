# A pull request that changes what the packages hold (netocc-core/src/, netocc-core/pack/) adds a changelog entry: a file
# in netocc-core/changes/ (python build.py change <type> "what changed"). The label "no changelog" skips the check for
# changes users don't see; adding or removing a label runs it again.
name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  entries:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no changelog') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: netocc-core
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: check the changelog entries
        run: python build.py changelog --check "origin/${{ github.base_ref }}"
